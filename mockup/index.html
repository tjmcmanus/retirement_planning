<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement Planner — UX Redesign Mockup</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f6; color: #262730; }
.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 240px; background: #fff; border-right: 1px solid #e0e0e0; padding: 16px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.main { flex: 1; padding: 24px 32px; overflow-x: hidden; }
.sidebar h3 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
.sidebar-btn { width: 100%; padding: 8px 12px; background: #f0f2f6; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 8px; text-align: left; }
.sidebar-link { display: block; font-size: 13px; color: #1f77b4; text-decoration: none; margin-bottom: 4px; }
.sidebar-divider { border: none; border-top: 1px solid #eee; margin: 12px 0; }
.sidebar-label { font-size: 12px; color: #555; margin-bottom: 3px; margin-top: 10px; }
.sidebar-input { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: #fafafa; }
.page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.page-header h1 { font-size: 24px; font-weight: 700; }
.badge { background: #e8f4fd; color: #1f77b4; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
.tab-bar { display: flex; gap: 0; border-bottom: 2px solid #e0e0e0; margin-bottom: 24px; }
.tab { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: #666; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .15s; white-space: nowrap; }
.tab:hover { color: #262730; background: #f8f9fa; }
.tab.active { color: #ff4b4b; border-bottom-color: #ff4b4b; font-weight: 700; }
.subtab-bar { display: flex; gap: 4px; margin-bottom: 20px; }
.subtab { padding: 7px 16px; cursor: pointer; font-size: 13px; font-weight: 500; color: #555; background: #f0f2f6; border-radius: 6px; transition: all .15s; }
.subtab:hover { background: #e0e3ea; }
.subtab.active { background: #ff4b4b; color: #fff; }
.section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #262730; }
.nw-statement { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; overflow: hidden; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.nw-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
.nw-header h2 { font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.nw-header span { font-size: 13px; opacity: .7; }
.nw-table { width: 100%; border-collapse: collapse; }
.nw-table th { background: #f8f9fa; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #888; padding: 10px 16px; text-align: right; border-bottom: 1px solid #eee; }
.nw-table th:first-child { text-align: left; }
.nw-table td { padding: 11px 16px; font-size: 14px; text-align: right; border-bottom: 1px solid #f0f0f0; }
.nw-table td:first-child { text-align: left; font-weight: 500; }
.nw-table tr:last-child td { border-bottom: none; font-weight: 700; font-size: 15px; background: #f8f9fa; }
.nw-table tr:hover td { background: #fafbff; }
.up { color: #21c354; }
.down { color: #ff4b4b; }
.up::before { content: '▲ '; font-size: 10px; }
.down::before { content: '▼ '; font-size: 10px; }
.account-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
.metrics-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
.metric-card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e8e8e8; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.metric-label { font-size: 12px; color: #888; margin-bottom: 4px; font-weight: 500; }
.metric-value { font-size: 20px; font-weight: 700; color: #262730; }
.metric-delta { font-size: 12px; margin-top: 4px; }
.metric-delta.pos { color: #21c354; }
.metric-delta.neg { color: #ff4b4b; }
.charts-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.chart-card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e8e8e8; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.chart-title { font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 12px; color: #444; }
.chart-placeholder { height: 180px; background: #f8f9fa; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 13px; position: relative; overflow: hidden; }
.fake-bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding: 0 12px; width: 100%; }
.fake-bar { flex: 1; border-radius: 4px 4px 0 0; }
.fake-pie { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(rgb(246,207,113) 0deg 60deg, rgb(254,136,177) 60deg 130deg, rgb(139,224,164) 130deg 260deg, rgb(180,151,231) 260deg 360deg); margin: 0 auto; }
.fake-stacked { display: flex; align-items: flex-end; gap: 5px; height: 140px; padding: 0 8px; width: 100%; }
.fake-stacked-bar { flex: 1; display: flex; flex-direction: column-reverse; border-radius: 3px 3px 0 0; overflow: hidden; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.phase-toggle { display: inline-flex; background: #f0f2f6; border-radius: 8px; padding: 4px; margin-bottom: 20px; }
.phase-btn { padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; color: #555; transition: all .15s; border: none; background: transparent; }
.phase-btn.active { background: #fff; color: #262730; box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 700; }
.params-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e8e8e8; }
.param-item { text-align: center; }
.param-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .05em; }
.param-value { font-size: 18px; font-weight: 700; color: #262730; margin-top: 2px; }
.data-table-wrap { background: #fff; border-radius: 10px; border: 1px solid #e8e8e8; overflow: hidden; margin-bottom: 16px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th { background: #f8f9fa; padding: 9px 10px; text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #666; border-bottom: 2px solid #e0e0e0; white-space: nowrap; }
.data-table td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #f0f0f0; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #fafbff; }
.stage-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.stage-work { background: #e8f4fd; color: #1f77b4; }
.stage-retire { background: #e8fdf0; color: #21a354; }
.portfolio-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.portfolio-table th { background: #f8f9fa; padding: 9px 10px; text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #666; border-bottom: 2px solid #e0e0e0; }
.portfolio-table td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #f0f0f0; }
.portfolio-table tr:last-child td { font-weight: 700; background: #f8f9fa; }
.pos-return { color: #21c354; }
.neg-return { color: #ff4b4b; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
.btn-primary { background: #ff4b4b; color: #fff; }
.btn-secondary { background: #f0f2f6; color: #262730; border: 1px solid #ddd; }
.btn-warning { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
.info-box { background: #e8f4fd; border-left: 4px solid #1f77b4; padding: 12px 16px; border-radius: 0 6px 6px 0; font-size: 13px; color: #1a4a6e; margin-bottom: 16px; }
.success-box { background: #e8fdf0; border-left: 4px solid #21c354; padding: 12px 16px; border-radius: 0 6px 6px 0; font-size: 13px; color: #155724; margin-bottom: 16px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.annotation { background: #fffbea; border: 1.5px dashed #f0c040; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #7a5c00; margin-bottom: 16px; display: flex; gap: 8px; align-items: flex-start; }
.annotation::before { content: '💡'; flex-shrink: 0; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.removed-tag { display: inline-block; background: #fde8e8; color: #c0392b; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
.new-tag { display: inline-block; background: #e8fdf0; color: #1a7a3c; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
.moved-tag { display: inline-block; background: #e8f4fd; color: #1a4a8e; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
.change-summary { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 24px; }
.change-summary h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #262730; }
.change-row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.change-row:last-child { border-bottom: none; }
.change-icon { font-size: 16px; flex-shrink: 0; width: 24px; text-align: center; }
.data-entry-form { background: #fff; border-radius: 10px; border: 1px solid #e8e8e8; padding: 20px; margin-bottom: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-label { font-size: 12px; font-weight: 600; color: #555; }
.form-input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
.form-select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; background: #fff; }
.stacked-area-fake { width: 100%; height: 200px; position: relative; overflow: hidden; border-radius: 6px; }
</style>
</head>
<body>
<div class="app-shell">
