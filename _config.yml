# Site settings
title: Financial Planner Documentation
description: Comprehensive retirement and financial planning application with advanced tax optimization, portfolio management, and Monte Carlo simulation
baseurl: "/retirement_planning" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site

# Build settings
theme: jekyll-theme-cayman
markdown: kramdown

# Exclude from processing
exclude:
  - .venv/
  - .pytest_cache/
  - .vscode/
  - .bob/
  - .streamlit/
  - components/
  - data/
  - pages/
  - "*.py"
  - "*.pyc"
  - "*.csv"
  - "*.json"
  - "*.yaml"
  - "*.yml"
  - "*.parquet"
  - "*.sh"
  - "*.bat"
  - "*.zip"
  - requirements.txt
  - pytest.ini
  - .gitignore
  - .env
  - .env.example
  - .DS_Store

# Include markdown documentation
include:
  - README.md
  - "*.md"

# Plugins
plugins:
  - jekyll-relative-links

# Relative links configuration
relative_links:
  enabled: true
  collections: true

# Navigation
navigation:
  - title: Home
    url: /
  - title: Getting Started
    url: /docs/getting-started
  - title: Features
    url: /docs/features
  - title: Guides
    url: /docs/guides
  - title: API Reference
    url: /docs/api-reference

