      CASH_SYMBOL: CASH
      CASH_PRICE: 1.0
    planning_app_py:
      ACCOUNT_TYPE_MAP:
        Cash: Cash & Equivalents
        Brokerage: Taxable Brokerage
        Traditional: Traditional (Pre-Tax)
        Roth: Roth (After-Tax)

  dependencies:
    external_modules:
      - streamlit>=1.28.0
      - pandas>=2.0.0
      - numpy>=1.24.0
      - yfinance>=0.2.28
      - plotly>=5.15.0
      - graphviz>=0.20.0
      - pyyaml>=6.0
      - pytest>=7.4.0
    internal_modules:
      - planning_app.py (entry point)
      - strategy.py (6-stage engine)
      - withdrawal_strategy.py (WithdrawalStrategyEngine class)
      - calculations.py (tax math)
      - betr_roth_conversion.py (BETR algorithm)
      - config.py (ConfigManager)
      - load_data.py (cached data loaders)
      - portfolio.py (portfolio data + yfinance)
      - tax_harvesting.py (harvest analysis)
      - portfolio_rebalancing.py (drift + rebalance)
      - income_expense.py (flow of funds)
      - ssi_calculator.py (dynamic SSI)
      - ssibenefits.py (legacy SSI lookup)
      - editable_table.py (Streamlit editable grid)
      - portfolio_data_entry.py (portfolio CSV editor)
      - generate_ssi_schedule.py (CLI SSI schedule generator)
      - components/sidebar.py (persistent sidebar)
      - pages/configuration.py (8-tab config UI)
      - pages/estate_planning.py (estate checklist)
    data_files:
      csv_reference:
        - income_rates.csv (federal income tax brackets)
        - cap_gains.csv (LTCG brackets)
        - irmaa.csv (Medicare IRMAA surcharges)
        - atm.csv (AMT brackets)
        - rmd.csv (RMD life expectancy factors)
        - standard.csv (standard deductions)
      portfolio_data:
        - portfolio_data_truth.csv (primary holdings source of truth)
        - portfolio_data_truth.2-entries.csv (minimal test fixture)
        - financial_account_sample.csv (deprecated sample)
        - financial_data_sample.csv (deprecated sample)
      social_security:
        - ssincome.csv (generated SS benefit schedule)
      example_outputs:
        - example1_strategy.csv
        - example2_early_retire.csv
        - example3_high_income.csv
        - example4_custom.csv
      config:
        - retirement_config.json (runtime config, gitignored)
        - estate_planning_data.json (estate checklist data, gitignored)

  testing:
    test_files:
      test_calculations.py:
        description: Unit tests for all calculations.py functions
        coverage: [calc_agi, calc_roth_conversions_tax, calculate_atm,
                   calculate_cap_gains, calculate_irmma_penalty, get_rmd_value]
      test_withdrawal_strategy.py:
        description: Tests for WithdrawalStrategyEngine and public API
        coverage: [determine_stage, calculate_multi_year_strategy,
                   build_withdrawal_strategy_display]
      test_accumulation_strategy.py:
        description: Tests for accumulation stage strategy
        coverage: [build_accumulation_strategy_display, payroll_taxes]
      test_betr_roth_conversion.py:
        description: Tests for BETR algorithm correctness
        coverage: [calculate_betr, optimize_conversion_amount, BETRInputs]
      test_config.py:
        description: Tests for ConfigManager persistence and defaults
        coverage: [get, set, save_config, _merge_with_defaults]
      test_logging.py:
        description: Tests for logging configuration and LOG_LEVEL env var
        coverage: [log level switching, debug output]
      test_portfolio_entry.py:
        description: Tests for portfolio data entry validation
        coverage: [validate_portfolio_dataframe, validate_ticker_symbol]
      test_ssi_calculator.py:
        description: Tests for SSI benefit calculation accuracy
        coverage: [calculate_benefit_at_claiming_age, calculate_benefit_with_cola]
      test_ssi_integration.py:
        description: Integration tests for SSI schedule generation
        coverage: [generate_ssi_schedule_from_config, export_ssi_schedule_to_csv]
      test_tax_harvesting.py:
        description: Tests for tax harvesting analysis
        coverage: [classify_harvest_opportunities, compute_net_tax_impact]
    example_files:
      example_withdrawal_strategy.py:
        description: Demonstrates WithdrawalStrategyEngine with sample data
      example_accumulation_strategy.py:
        description: Demonstrates accumulation stage strategy with sample data
    run_commands:
      all_tests: pytest
      specific: pytest test_calculations.py -v
      with_coverage: pytest --cov=. --cov-report=html

  integration:
    streamlit_app:
      entry_point: planning_app.py
      run_commands:
        unix: sh run.sh
        windows: run.bat
        manual: streamlit run planning_app.py --server.port 8502
      port: 8502
      headless: true (production)
    page_routing:
      main_app: planning_app.py (6 tabs)
      configuration: pages/configuration.py (Streamlit page)
      estate_planning: pages/estate_planning.py (Streamlit page)
    config_integration:
      load_on_startup: ConfigManager loads retirement_config.json
      sync_to_session: sync_config_to_session_state() called on each page load
      sidebar_persistence: save_sidebar_value_to_config() on widget change
    data_flow:
      portfolio_data: portfolio_data_truth.csv → load_data.py → portfolio.py → planning_app.py
      tax_data: income_rates.csv + cap_gains.csv + irmaa.csv → load_data.py → calculations.py
      ssi_data: ssincome.csv → load_data.py → ssibenefits.py / ssi_calculator.py
      strategy: config + networth → strategy.py → planning_app.py Tab 2
      income_expense: config + networth + ssi → income_expense.py → planning_app.py Tab 4

  performance:
    caching_strategy:
      yfinance_prices:
        function: get_current_price()
        cache: st.cache_data(ttl=300) — 5-minute TTL
        rationale: Avoid excessive API calls during session
      csv_reference_data:
        functions: [get_income_tax_brackets, get_cap_gains_brackets,
                    get_std_deduction, get_medicare_costs, get_atm_costs,
                    load_rmd_data, load_ssi_data]
        cache: st.cache_data (no TTL — static reference data)
      portfolio_data:
        functions: [get_net_worth, get_networth_by_month, get_portfolio_truth_by_month]
        cache: st.cache_data (no TTL — cleared on portfolio update)
    cache_invalidation:
      trigger: Sidebar value change or portfolio data save
      mechanism: CACHE_CLEAR_KEYS list in sidebar.py — calls .clear() on each cached function
    optimization_techniques:
      - Vectorised pandas operations for portfolio calculations
      - Single CSV read per session (cached)
      - Lazy loading of yfinance data (only fetches symbols present in portfolio)
      - DataFrame styling applied once, not per render

  limitations:
    current:
      - Single-user application (no authentication or multi-user support)
      - No Monte Carlo simulation (deterministic projections only)
      - No automatic tax-lot tracking (cost basis entered manually)
      - No direct brokerage API integration (manual CSV updates)
      - State tax model is simplified (no local/city taxes)
      - No Roth IRA 5-year rule tracking
      - No Social Security spousal benefit optimisation algorithm
      - Estate planning is checklist-only (no legal document generation)
    assumptions:
      - Married Filing Jointly throughout retirement
      - Constant rate of return (no sequence-of-returns risk modelling)
      - Inflation applied uniformly to expenses
      - SS benefits claimed at configured age (no optimisation search)
      - Medicare costs based on base premiums + IRMAA (no supplemental Medigap)
      - All Roth conversions completed in calendar year shown
    tax_planning_status:
      implemented: [federal income tax, LTCG, AMT, NIIT, IRMAA, state tax,
                    payroll taxes, DAF deduction, standard deduction]
      not_implemented: [local/city taxes, Roth 5-year rule, QCD tracking,
                        gift tax, estate tax calculation, SALT deduction cap]

  future_enhancements:
    planned:
      - Monte Carlo simulation for sequence-of-returns risk
      - Spousal Social Security benefit optimisation (file-and-suspend strategies)
      - Direct brokerage API integration (Fidelity, Schwab, Vanguard)
      - Roth IRA 5-year rule tracking per conversion
      - QCD (Qualified Charitable Distribution) tracking and optimisation
      - Multi-scenario comparison (optimistic / base / pessimistic)
      - PDF report generation
      - Email/notification reminders for annual review tasks
    v2_0_additions:
      - BETR Roth conversion algorithm (implemented July 2025)
      - RMD lookback optimisation
      - Portfolio rebalancing module
      - Tax harvesting module
      - Dynamic SSI calculator (replacing static lookup)
      - Estate planning page
      - Retirement Readiness Indicator (RRI)
      - Flow-of-funds Graphviz diagram
      - 8-tab configuration page
      - State tax with 50-state implementation
    account_rebalancing_implementation:
      status: Partially implemented
      reference: ACCOUNT_REBALANCING_IMPLEMENTATION.md
      remaining:
        - Buffer maintenance automation
        - Roth conversion execution tracking
        - Fund movement audit trail

  documentation:
    readme: README.md
    guides:
      - CONFIG_GUIDE.md (configuration system)
      - STRATEGY_README.md (withdrawal strategy engine)
      - BETR_GUIDE.md (BETR algorithm)
      - BETR_CORRECTION_NOTES.md (algorithm corrections)
      - LOGGING_GUIDE.md (logging configuration)
      - SSI_CALCULATOR_GUIDE.md (SSI calculator)
      - SSI_INTEGRATION_GUIDE.md (SSI integration)
      - PORTFOLIO_REBALANCING_GUIDE.md (rebalancing)
      - UX_REDESIGN_PLAN.md (UI redesign notes)
      - ACCOUNT_REBALANCING_IMPLEMENTATION.md (rebalancing implementation)
      - IMPLEMENTATION_SUMMARY.md (v2.0 implementation summary)
      - DOCUMENTATION_REVIEW_SUMMARY.md (doc review)
      - ERRORS_FOUND.md (known issues log)
    references:
      - Vanguard BETR methodology (2025)
      - IRS Publication 590-B (RMD Uniform Lifetime Table)
      - IRS Publication 946 (AMT)
      - CMS Medicare IRMAA tables
      - SSA OASDI benefit calculation rules

  logging:
    configuration:
      env_var: LOG_LEVEL
      default: WARNING
      values: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
      setup: logging.basicConfig() in each module
    log_points:
      - Config load/save operations
      - Portfolio data fetch (yfinance calls)
      - Strategy stage determination
      - Tax calculation inputs/outputs (DEBUG level)
      - Cache clear events
      - SSI schedule generation
    debug_usage:
      enable: export LOG_LEVEL=DEBUG before running streamlit
      guide: LOGGING_GUIDE.md

  version_history:
    v1.0:
      description: Initial release with basic portfolio tracking and withdrawal strategy
      features:
        - 5-stage withdrawal strategy engine
        - Basic tax calculations (federal income, LTCG)
        - Static SSI lookup from ssincome.csv
        - Simple portfolio display with yfinance prices
        - ConfigManager with JSON persistence
        - Streamlit multi-tab UI
    v2.0:
      description: >
        Major enhancement release adding BETR algorithm, dynamic SSI calculator,
        portfolio rebalancing, tax harvesting, estate planning, and comprehensive
        tax modelling (AMT, NIIT, IRMAA, state tax, payroll taxes).
      features:
        - BETR Roth conversion algorithm (Vanguard 2025)
        - 6th life stage (Prep for Retirement)
        - RMD lookback optimisation
        - Dynamic SSI calculator with COLA
        - Portfolio rebalancing with drift detection
        - Tax-loss and tax-gain harvesting
        - Estate planning page with checklist and document tracker
        - Retirement Readiness Indicator (RRI) composite score
        - Flow-of-funds Graphviz diagram
        - 8-tab configuration page
        - 50-state income tax implementation
        - Payroll tax calculation (FICA, Medicare, FUTA, SUTA)
        - AMT calculation
        - NIIT at 3.8%
        - IRMAA with 2-year lookback
        - DAF contribution optimisation
        - Historical net worth trend chart