healthcare_cost_projections:
  overview:
    description: |
      Healthcare costs are one of the largest and most unpredictable expenses in retirement.
      This module provides comprehensive healthcare cost modeling including Medicare premiums,
      out-of-pocket expenses, long-term care costs, and IRMAA penalties. Proper healthcare
      cost planning is essential for accurate retirement projections.
      
    key_components:
      - "Medicare Part B and Part D premiums (with IRMAA)"
      - "Medicare Supplement (Medigap) or Medicare Advantage premiums"
      - "Out-of-pocket medical expenses (deductibles, copays, prescriptions)"
      - "Long-term care insurance premiums"
      - "Long-term care costs (nursing home, assisted living, home care)"
      - "Pre-Medicare healthcare costs (ACA marketplace or COBRA)"
      - "Dental and vision expenses (not covered by Medicare)"
      
    importance:
      - "Healthcare costs grow faster than general inflation (typically 5-7% annually)"
      - "IRMAA penalties can significantly increase Medicare costs"
      - "Long-term care can deplete retirement savings rapidly"
      - "Pre-Medicare coverage (age 62-65) can be very expensive"
  
  medicare_costs:
