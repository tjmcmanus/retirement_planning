      function_implementation: "3-4 hours"
      integration: "2-3 hours"
      testing: "2-3 hours"
      total: "11-16 hours"


# ==============================================================================
# TAX PLANNING: ALTERNATIVE MINIMUM TAX (AMT)
# ==============================================================================

amt_planning:
  overview:
    description: |
      The Alternative Minimum Tax (AMT) is a parallel tax system designed to ensure
      high-income taxpayers pay a minimum amount of tax. While less common in retirement,
      AMT can be triggered by large Roth conversions, exercise of incentive stock options,
      or high state tax deductions. Understanding AMT is crucial for optimizing retirement
      income strategies.
      
  amt_basics:
    purpose: "Prevent high-income taxpayers from using deductions to avoid taxes"
    mechanism: "Calculate tax under both regular and AMT systems, pay the higher amount"
    
    exemption_amounts_2024:
      single: "$85,700"
      married_filing_jointly: "$133,300"
      phase_out_threshold_single: "$609,350"
      phase_out_threshold_mfj: "$1,218,700"
      
    amt_rates:
      rate_1: "26% on AMTI up to $220,700 (MFJ)"
      rate_2: "28% on AMTI above $220,700 (MFJ)"
      
  amt_triggers_in_retirement:
    common_triggers:
      - trigger: "Large Roth conversions"
        reason: "Increases income without increasing deductions"
        threshold: "Conversions pushing income above AMT exemption"
        
      - trigger: "High state and local tax (SALT) deductions"
        reason: "SALT deductions limited under regular tax but added back for AMT"
        impact: "Pre-TCJA concern, less relevant with $10K SALT cap"
        
      - trigger: "Large capital gains"
        reason: "Increases AMTI"
        context: "Especially when combined with conversions"
        
      - trigger: "Incentive Stock Options (ISOs)"
        reason: "ISO spread added to AMTI"
        relevance: "Early retirees with unvested ISOs"
        
      - trigger: "Private activity bond interest"
        reason: "Tax-exempt for regular tax but taxable for AMT"
        strategy: "Avoid these bonds if near AMT threshold"
        
    less_common_in_retirement:
      - "Depreciation differences (rental properties)"
      - "Passive activity losses"
      - "Miscellaneous itemized deductions (eliminated by TCJA)"
      
  amt_calculation_process:
    step_1_calculate_amti:
      description: "Alternative Minimum Taxable Income"
      formula: |
        AMTI = Regular Taxable Income
             + AMT Adjustments
             + AMT Preferences
             - AMT Exemption (if applicable)
             
    step_2_amt_adjustments:
      common_adjustments:
        - "Add back: State and local taxes (pre-TCJA)"
        - "Add back: Miscellaneous itemized deductions"
        - "Add back: Standard deduction (use itemized for AMT)"
        - "Adjust: Depreciation differences"
        
    step_3_amt_preferences:
      items:
        - "Private activity bond interest"
        - "ISO spread (exercise price - FMV)"
        - "Percentage depletion"
        
    step_4_apply_exemption:
      formula: |
        if AMTI <= phase_out_threshold:
            amt_exemption = full_exemption
        else:
            reduction = (AMTI - phase_out_threshold) * 0.25
            amt_exemption = max(0, full_exemption - reduction)
            
    step_5_calculate_amt:
      formula: |
        tentative_amt = (AMTI - amt_exemption) * amt_rate
        amt_owed = max(0, tentative_amt - regular_tax)
        
  retirement_specific_strategies:
    roth_conversion_optimization:
      issue: "Large conversions can trigger AMT"
      strategy: "Split conversions across multiple years"
      calculation: |
        # Calculate AMT impact of proposed conversion
        regular_tax_with_conversion = calculate_regular_tax(income + conversion)
        amt_with_conversion = calculate_amt(income + conversion)
        
        if amt_with_conversion > regular_tax_with_conversion:
            # In AMT - consider reducing conversion
  
  amt_implementation:
    status: "Ready for Implementation"
    priority: "MEDIUM"
    
    data_files_required:
      amt_parameters_csv:
        description: "AMT exemption amounts, phase-out thresholds, and rates by year"
        note: "Can use existing atm.csv file or create new amt_parameters.csv"
        columns:
          - "year: Tax year"
          - "filing_status: Filing status"
          - "exemption_amount: AMT exemption"
          - "phase_out_threshold: Income level where exemption starts phasing out"
          - "phase_out_rate: Rate at which exemption phases out (typically 0.25)"
          - "rate_1: First AMT rate (26%)"
          - "rate_1_threshold: Income threshold for rate_1"
          - "rate_2: Second AMT rate (28%)"
        example_rows:
          - "2024,married_filing_jointly,133300,1218700,0.25,0.26,220700,0.28"
          - "2024,single,85700,609350,0.25,0.26,220700,0.28"
    
    implementation_functions:
      load_amt_parameters:
        signature: |
          def load_amt_parameters(year: int, filing_status: str = "married_filing_jointly") -> Dict:
              """
              Load AMT parameters from CSV file
              
              Args:
                  year: Tax year
                  filing_status: Filing status
              
              Returns:
                  Dictionary with AMT parameters
              """
        implementation: |
          def load_amt_parameters(year: int, filing_status: str = "married_filing_jointly") -> Dict:
              """Load AMT parameters from CSV file"""
              
              # Try existing atm.csv first, fall back to amt_parameters.csv
              try:
                  df = pd.read_csv('atm.csv')
              except FileNotFoundError:
                  df = pd.read_csv('amt_parameters.csv')
              
              params = df[
                  (df['year'] == year) & 
                  (df['filing_status'] == filing_status)
              ].iloc[0]
              
              return {
                  'exemption_amount': params['exemption_amount'],
                  'phase_out_threshold': params['phase_out_threshold'],
                  'phase_out_rate': params['phase_out_rate'],
                  'rate_1': params['rate_1'],
                  'rate_1_threshold': params['rate_1_threshold'],
                  'rate_2': params['rate_2']
              }
      
      calculate_amt_full:
        signature: |
          def calculate_amt(income: float, conversions: float, deductions: float,
                           state_taxes: float, year: int,
                           filing_status: str = "married_filing_jointly",
                           iso_spread: float = 0,
                           private_activity_bonds: float = 0) -> Tuple[float, float, float, Dict]:
              """
              Calculate Alternative Minimum Tax
              
              Args:
                  income: Regular taxable income
                  conversions: Roth conversion amount
                  deductions: Regular tax deductions
                  state_taxes: State and local taxes paid
                  year: Tax year
                  filing_status: Filing status
                  iso_spread: ISO exercise spread (if applicable)
                  private_activity_bonds: Private activity bond interest
              
              Returns:
                  Tuple of (amt_owed, tentative_amt, regular_tax, details)
              """
        implementation: |
          def calculate_amt(income: float, conversions: float, deductions: float,
                           state_taxes: float, year: int,
                           filing_status: str = "married_filing_jointly",
                           iso_spread: float = 0,
                           private_activity_bonds: float = 0) -> Tuple[float, float, float, Dict]:
              """Calculate Alternative Minimum Tax"""
              
              # Load AMT parameters
              amt_params = load_amt_parameters(year, filing_status)
              
              # Step 1: Calculate regular tax (use existing function)
              regular_tax = calculate_taxable_income(
                  income + conversions,
                  deductions,
                  year,
                  filing_status
              )
              
              # Step 2: Calculate AMTI (Alternative Minimum Taxable Income)
              amti = income + conversions
              
              # Add back AMT adjustments
              amti += state_taxes  # State taxes added back for AMT
              # Note: Post-TCJA, standard deduction is same for AMT
              
              # Add AMT preferences
              amti += iso_spread  # ISO exercise spread
              amti += private_activity_bonds  # Private activity bond interest
              
              # Step 3: Calculate AMT exemption (with phase-out)
              if amti <= amt_params['phase_out_threshold']:
                  amt_exemption = amt_params['exemption_amount']
              else:
                  excess = amti - amt_params['phase_out_threshold']
                  reduction = excess * amt_params['phase_out_rate']
                  amt_exemption = max(0, amt_params['exemption_amount'] - reduction)
              
              # Step 4: Calculate tentative AMT
              amti_after_exemption = max(0, amti - amt_exemption)
              
              if amti_after_exemption <= amt_params['rate_1_threshold']:
                  tentative_amt = amti_after_exemption * amt_params['rate_1']
              else:
                  tentative_amt = (
                      amt_params['rate_1_threshold'] * amt_params['rate_1'] +
                      (amti_after_exemption - amt_params['rate_1_threshold']) * amt_params['rate_2']
                  )
              
              # Step 5: AMT owed is excess over regular tax
              amt_owed = max(0, tentative_amt - regular_tax)
              
              # Calculation details
              details = {
                  'amti': amti,
                  'amt_exemption': amt_exemption,
                  'amti_after_exemption': amti_after_exemption,
                  'tentative_amt': tentative_amt,
                  'regular_tax': regular_tax,
                  'amt_owed': amt_owed,
                  'in_amt': amt_owed > 0,
                  'adjustments': {
                      'state_taxes': state_taxes,
                      'iso_spread': iso_spread,
                      'private_activity_bonds': private_activity_bonds
                  }
              }
              
              logger.debug(f"AMT Calculation: AMTI=${amti:,.0f}, "
                          f"Exemption=${amt_exemption:,.0f}, "
                          f"Tentative AMT=${tentative_amt:,.0f}, "
                          f"Regular Tax=${regular_tax:,.0f}, "
                          f"AMT Owed=${amt_owed:,.0f}")
              
              return amt_owed, tentative_amt, regular_tax, details
      
      optimize_conversion_to_avoid_amt:
        signature: |
          def optimize_conversion_to_avoid_amt(base_income: float,
                                               max_conversion: float,
                                               year: int,
                                               filing_status: str = "married_filing_jointly") -> Tuple[float, Dict]:
              """
              Find optimal Roth conversion amount that avoids triggering AMT
              
              Args:
                  base_income: Income before conversion
                  max_conversion: Maximum desired conversion amount
                  year: Tax year
                  filing_status: Filing status
              
              Returns:
                  Tuple of (optimal_conversion, analysis)
              """
        implementation: |
          def optimize_conversion_to_avoid_amt(base_income: float,
                                               max_conversion: float,
                                               year: int,
                                               filing_status: str = "married_filing_jointly") -> Tuple[float, Dict]:
              """Find optimal Roth conversion that avoids AMT"""
              
              # Binary search for conversion amount that stays below AMT
              low = 0
              high = max_conversion
              optimal = 0
              
              while high - low > 100:  # $100 precision
                  mid = (low + high) / 2
                  
                  amt_owed, _, _, _ = calculate_amt(
                      income=base_income,
                      conversions=mid,
                      deductions=0,  # Simplified
                      state_taxes=0,
                      year=year,
                      filing_status=filing_status
                  )
                  
                  if amt_owed > 0:
                      # In AMT, reduce conversion
                      high = mid
                  else:
                      # Not in AMT, can increase conversion
                      optimal = mid
                      low = mid
              
              # Calculate final AMT status
              amt_owed, tentative_amt, regular_tax, details = calculate_amt(
                  income=base_income,
                  conversions=optimal,
                  deductions=0,
                  state_taxes=0,
                  year=year,
                  filing_status=filing_status
              )
              
              analysis = {
                  'optimal_conversion': optimal,
                  'max_conversion_requested': max_conversion,
                  'conversion_reduced_by': max_conversion - optimal,
                  'amt_avoided': amt_owed == 0,
                  'regular_tax': regular_tax,
                  'tentative_amt': tentative_amt,
                  'details': details
              }
              
              return optimal, analysis
      
