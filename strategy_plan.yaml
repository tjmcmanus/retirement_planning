          def load_state_tax_data(state: str, year: int) -> Dict:
              """Load state tax data from CSV files"""
              
              # Load tax brackets
              brackets_df = pd.read_csv('state_tax_brackets.csv')
              brackets = brackets_df[
                  (brackets_df['state'] == state) & 
                  (brackets_df['year'] == year)
              ]
              
              # Load deductions
              deductions_df = pd.read_csv('state_deductions.csv')
              deduction = deductions_df[
                  (deductions_df['state'] == state) & 
                  (deductions_df['year'] == year)
              ]['standard_deduction'].iloc[0]
              
              # Load retirement exemptions
              exemptions_df = pd.read_csv('state_retirement_exemptions.csv')
              exemptions = exemptions_df[exemptions_df['state'] == state].iloc[0]
              
              return {
                  'brackets': brackets,
                  'standard_deduction': deduction,
                  'retirement_exempt': exemptions['retirement_income_exempt'],
                  'ss_taxable': exemptions['ss_taxable'],
                  'pension_exempt_amount': exemptions['pension_exempt_amount']
              }
      
      calculate_state_tax_full:
        signature: |
          def calculate_state_tax(state_agi: float, state: str, year: int,
                                 filing_status: str = "married_filing_jointly",
                                 retirement_income: float = 0,
                                 ss_benefits: float = 0) -> Tuple[float, Dict]:
              """
              Calculate state income tax with retirement exemptions
              
              Args:
                  state_agi: State Adjusted Gross Income
                  state: Two-letter state code
                  year: Tax year
                  filing_status: Filing status
                  retirement_income: IRA/401k distributions
                  ss_benefits: Social Security benefits
              
              Returns:
                  Tuple of (state_tax, calculation_details)
              """
        implementation: |
          def calculate_state_tax(state_agi: float, state: str, year: int,
                                 filing_status: str = "married_filing_jointly",
                                 retirement_income: float = 0,
                                 ss_benefits: float = 0) -> Tuple[float, Dict]:
              """Calculate state income tax with retirement exemptions"""
              
              # Load state data
              state_data = load_state_tax_data(state, year)
              
              # No-tax states
              if state in ['FL', 'TX', 'WA', 'NV', 'SD', 'WY', 'AK', 'TN', 'NH']:
                  return 0.0, {'state': state, 'note': 'No state income tax'}
              
              # Apply retirement income exemptions
              adjusted_agi = state_agi
              
              if state_data['retirement_exempt']:
                  # States like PA, IL, MS exempt all retirement income
                  adjusted_agi -= min(retirement_income, state_data['pension_exempt_amount'])
              
              if not state_data['ss_taxable']:
                  # State doesn't tax Social Security
                  adjusted_agi -= ss_benefits
              
              # Apply standard deduction
              taxable_income = max(0, adjusted_agi - state_data['standard_deduction'])
              
              # Calculate tax using brackets
              state_tax = 0.0
              brackets = state_data['brackets']
              
              for _, bracket in brackets.iterrows():
                  bracket_min = bracket['bracket_min']
                  bracket_max = bracket['bracket_max']
                  rate = bracket['rate']
                  
                  if taxable_income > bracket_min:
                      taxable_in_bracket = min(taxable_income, bracket_max) - bracket_min
                      state_tax += taxable_in_bracket * rate
              
              details = {
                  'state': state,
                  'state_agi': state_agi,
                  'retirement_exemption': state_agi - adjusted_agi,
                  'standard_deduction': state_data['standard_deduction'],
                  'taxable_income': taxable_income,
                  'state_tax': state_tax
              }
              
              return state_tax, details
      
      integrate_state_tax_with_stages:
        description: "Add state tax calculations to all stage strategies"
        changes_required:
          - "Import calculate_state_tax() in strategy.py"
          - "Add state parameter to YearlyStrategy dataclass"
          - "Calculate state tax in each stage's calculate_strategy()"
          - "Add state_tax field to YearlyStrategy output"
          - "Include state tax in total_tax calculations"
        
        example_integration: |
          # In each stage's calculate_strategy() method:
          
          # Calculate federal tax (existing)
          federal_tax = calculate_taxable_income(...)
          
          # NEW: Calculate state tax
          state = config.get('personal_info', 'state_of_residence', 'CA')
          state_tax, state_details = calculate_state_tax(
              state_agi=agi,
              state=state,
              year=year,
              filing_status='married_filing_jointly',
              retirement_income=traditional_withdrawal + roth_conversion,
              ss_benefits=ss_benefits
          )
          
          # Total tax includes state
          total_tax = federal_tax + state_tax
          
          # Add to YearlyStrategy
          return YearlyStrategy(
              # ... existing fields ...
              federal_tax=federal_tax,
              state_tax=state_tax,
              total_tax=total_tax,
              state_details=state_details
          )
    
    testing_requirements:
      unit_tests:
        - "test_load_state_tax_data() - Verify CSV loading"
        - "test_calculate_state_tax_no_tax_states() - FL, TX, etc."
        - "test_calculate_state_tax_high_tax_states() - CA, NY, NJ"
        - "test_calculate_state_tax_retirement_friendly() - PA, IL, MS"
        - "test_state_tax_with_ss_exemption()"
        - "test_state_tax_with_retirement_exemption()"
        
      integration_tests:
        - "test_state_tax_in_stage_2_early_retirement()"
        - "test_state_tax_impact_on_roth_conversions()"
        - "test_state_tax_with_irmaa_optimization()"
        - "test_multi_year_projection_with_state_tax()"
    
    estimated_effort:
