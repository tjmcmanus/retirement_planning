      stage_3_medicare:
        consideration: "AMT vs IRMAA trade-off"
        analysis: "AMT now vs IRMAA penalties later"
        
      stage_4_social_security:
        check: "AMT impact of SS + conversions + capital gains"
        strategy: "Coordinate income sources to avoid AMT"
        
    calculation_method: |
      def calculate_amt_impact(income, conversions, deductions):
          # Calculate regular tax
          regular_tax = calculate_regular_tax(income + conversions, deductions)
          
          # Calculate AMTI
          amti = income + conversions
          amti += amt_adjustments  # Add back state taxes, etc.
          amti += amt_preferences  # Add private activity bond interest, etc.
          
          # Apply AMT exemption
          amt_exemption = get_amt_exemption(amti, filing_status, year)
          amti_after_exemption = max(0, amti - amt_exemption)
          
          # Calculate tentative AMT
          if amti_after_exemption <= 220700:  # 2024 threshold for MFJ
              tentative_amt = amti_after_exemption * 0.26
          else:
              tentative_amt = 220700 * 0.26 + (amti_after_exemption - 220700) * 0.28
              
          # AMT owed is excess over regular tax
          amt_owed = max(0, tentative_amt - regular_tax)
          
          return amt_owed, tentative_amt, regular_tax

# ==============================================================================
# TAX PLANNING: NET INVESTMENT INCOME TAX (NIIT)
# ==============================================================================

niit_planning:
  overview:
    description: |
      The Net Investment Income Tax (NIIT) is a 3.8% surtax on net investment income
      for high-income taxpayers. Enacted as part of the Affordable Care Act, NIIT applies
      to the lesser of net investment income or the amount by which MAGI exceeds threshold
      amounts. Strategic planning can minimize or avoid this additional tax burden.
      
  niit_basics:
    rate: "3.8%"
    applies_to: "Lesser of (1) Net Investment Income or (2) Excess MAGI over threshold"
    
    thresholds_2024:
      married_filing_jointly: "$250,000"
      single: "$200,000"
      married_filing_separately: "$125,000"
      head_of_household: "$200,000"
      
    note: "Thresholds are NOT indexed for inflation"
    
  net_investment_income_definition:
    included:
      - type: "Interest income"
        examples: "Bonds, CDs, savings accounts"
        exception: "Interest from tax-exempt municipal bonds"
        
      - type: "Dividend income"
        examples: "Qualified and non-qualified dividends"
        note: "Both types subject to NIIT"
        
      - type: "Capital gains"
        examples: "Long-term and short-term capital gains"
        source: "Sale of stocks, bonds, mutual funds"
        
      - type: "Rental income"
        condition: "If passive activity"
        exception: "Active real estate professionals exempt"
        
      - type: "Royalty income"
        examples: "Oil/gas royalties, intellectual property"
        
      - type: "Annuity income"
        condition: "Non-qualified annuities only"
        exception: "Qualified annuities (IRA, 401k) exempt"
        
    excluded:
      - "Wages and self-employment income"
      - "Social Security benefits"
      - "Tax-exempt interest (municipal bonds)"
      - "Distributions from qualified retirement plans (IRA, 401k, Roth IRA)"
      - "Active business income (if materially participating)"
      - "Life insurance proceeds"
      - "Veterans benefits"
      - "Alimony (pre-2019 divorces)"
      
  retirement_implications:
    key_insight: "Retirement account distributions are NOT subject to NIIT"
    
    strategic_advantage:
      traditional_ira_roth_ira:
        niit_status: "Distributions NOT subject to NIIT"
        benefit: "Can withdraw large amounts without triggering NIIT"
        strategy: "Prefer retirement account withdrawals over taxable account"
        
      taxable_account:
        niit_status: "Interest, dividends, capital gains ARE subject to NIIT"
        impact: "Effective tax rate can be 23.8% (20% + 3.8%) on LTCG"
        strategy: "Minimize taxable account income when near threshold"
        
    roth_conversion_impact:
      direct_effect: "Roth conversions increase MAGI"
      indirect_effect: "Higher MAGI can trigger NIIT on investment income"
      calculation: |
        # Conversion increases MAGI
        magi_with_conversion = base_magi + roth_conversion
        
        # If MAGI exceeds threshold, NIIT applies
        if magi_with_conversion > niit_threshold:
            excess_magi = magi_with_conversion - niit_threshold
            niit_owed = min(net_investment_income, excess_magi) * 0.038
            
      strategy: "Consider NIIT impact when sizing Roth conversions"
      
  niit_calculation_process:
    step_1_calculate_net_investment_income:
      formula: |
        Net Investment Income = 
            Interest Income
          + Dividend Income  
          + Capital Gains
          + Rental Income (if passive)
          + Royalty Income
          + Annuity Income (non-qualified)
          - Investment Expenses (limited by TCJA)
          
    step_2_calculate_magi:
      formula: |
        MAGI = AGI + Foreign Earned Income Exclusion
        # For most retirees, MAGI = AGI
        
    step_3_determine_excess_magi:
      formula: |
        Excess MAGI = max(0, MAGI - NIIT_Threshold)
        
    step_4_calculate_niit:
      formula: |
        NIIT = min(Net_Investment_Income, Excess_MAGI) * 0.038
        
    example_calculation:
      scenario: |
        Married Filing Jointly
        MAGI: $300,000
        Net Investment Income: $75,000
        
      calculation: |
        NIIT_Threshold = $250,000
        Excess_MAGI = $300,000 - $250,000 = $50,000
        
        NIIT = min($75,000, $50,000) * 0.038
        NIIT = $50,000 * 0.038 = $1,900
        
  strategic_planning_approaches:
    threshold_management:
      objective: "Keep MAGI below $250,000 (MFJ) to avoid NIIT entirely"
  
  niit_implementation:
    status: "Ready for Implementation"
    priority: "MEDIUM"
    
    data_files_required:
      niit_thresholds_csv:
        description: "NIIT thresholds by filing status (NOT indexed for inflation)"
        columns:
          - "filing_status: Filing status"
          - "threshold: MAGI threshold for NIIT"
          - "rate: NIIT rate (always 0.038)"
        example_rows:
          - "married_filing_jointly,250000,0.038"
          - "single,200000,0.038"
          - "married_filing_separately,125000,0.038"
          - "head_of_household,200000,0.038"
        note: "Thresholds have NOT changed since 2013 and are NOT indexed"
    
    implementation_functions:
      load_niit_thresholds:
        signature: |
          def load_niit_thresholds(filing_status: str = "married_filing_jointly") -> Dict:
              """
              Load NIIT thresholds from CSV file
              
              Args:
                  filing_status: Filing status
              
              Returns:
                  Dictionary with NIIT threshold and rate
              """
        implementation: |
          def load_niit_thresholds(filing_status: str = "married_filing_jointly") -> Dict:
              """Load NIIT thresholds from CSV file"""
              
              # Hardcoded thresholds (not indexed for inflation)
              thresholds = {
                  'married_filing_jointly': 250000,
                  'single': 200000,
                  'married_filing_separately': 125000,
                  'head_of_household': 200000
              }
              
              return {
                  'threshold': thresholds.get(filing_status, 250000),
                  'rate': 0.038
              }
      
      calculate_net_investment_income:
        signature: |
          def calculate_net_investment_income(interest: float,
                                              dividends: float,
                                              capital_gains: float,
                                              rental_income: float = 0,
                                              royalties: float = 0) -> float:
              """
              Calculate Net Investment Income for NIIT
              
              Args:
                  interest: Interest income (taxable)
                  dividends: Dividend income (qualified and non-qualified)
                  capital_gains: Capital gains (long-term and short-term)
                  rental_income: Passive rental income
                  royalties: Royalty income
              
              Returns:
                  Total net investment income
              
              Note:
                  Excludes: Wages, SS benefits, IRA/401k distributions, tax-exempt interest
              """
        implementation: |
          def calculate_net_investment_income(interest: float,
                                              dividends: float,
                                              capital_gains: float,
                                              rental_income: float = 0,
                                              royalties: float = 0) -> float:
              """Calculate Net Investment Income for NIIT"""
              
              # Sum all investment income sources
              nii = interest + dividends + capital_gains + rental_income + royalties
              
              logger.debug(f"Net Investment Income: Interest=${interest:,.0f}, "
                          f"Dividends=${dividends:,.0f}, "
                          f"Capital Gains=${capital_gains:,.0f}, "
                          f"Total NII=${nii:,.0f}")
              
              return nii
      
      calculate_niit_full:
        signature: |
          def calculate_niit(net_investment_income: float,
                            magi: float,
                            filing_status: str = "married_filing_jointly") -> Tuple[float, Dict]:
              """
              Calculate Net Investment Income Tax (3.8% surtax)
              
              Args:
                  net_investment_income: Total investment income
                  magi: Modified Adjusted Gross Income
                  filing_status: Filing status
              
              Returns:
                  Tuple of (niit_amount, calculation_details)
              
              Formula:
                  NIIT = min(NII, max(0, MAGI - threshold)) * 0.038
              """
        implementation: |
          def calculate_niit(net_investment_income: float,
                            magi: float,
                            filing_status: str = "married_filing_jointly") -> Tuple[float, Dict]:
              """Calculate Net Investment Income Tax"""
              
              # Load thresholds
              niit_params = load_niit_thresholds(filing_status)
              threshold = niit_params['threshold']
              rate = niit_params['rate']
              
              # Calculate excess MAGI over threshold
              excess_magi = max(0, magi - threshold)
              
              # NIIT applies to lesser of NII or excess MAGI
              niit_base = min(net_investment_income, excess_magi)
              
              # Calculate NIIT
              niit_amount = niit_base * rate
              
              # Calculation details
              details = {
                  'net_investment_income': net_investment_income,
                  'magi': magi,
                  'threshold': threshold,
                  'excess_magi': excess_magi,
                  'niit_base': niit_base,
                  'niit_rate': rate,
                  'niit_amount': niit_amount,
                  'subject_to_niit': niit_amount > 0
              }
              
              if niit_amount > 0:
                  logger.info(f"NIIT Triggered: MAGI=${magi:,.0f} exceeds threshold=${threshold:,.0f}, "
                             f"NIIT=${niit_amount:,.0f}")
              else:
                  logger.debug(f"No NIIT: MAGI=${magi:,.0f} below threshold=${threshold:,.0f}")
              
              return niit_amount, details
      
      optimize_withdrawals_for_niit:
        signature: |
          def optimize_withdrawals_for_niit(base_magi: float,
                                           net_investment_income: float,
                                           traditional_withdrawal: float,
                                           filing_status: str = "married_filing_jointly") -> Dict:
              """
              Analyze NIIT impact and suggest withdrawal optimization
              
              Args:
                  base_magi: MAGI before additional withdrawals
                  net_investment_income: Investment income from taxable accounts
                  traditional_withdrawal: Proposed Traditional IRA withdrawal
                  filing_status: Filing status
              
              Returns:
                  Dictionary with NIIT analysis and recommendations
              """
        implementation: |
          def optimize_withdrawals_for_niit(base_magi: float,
                                           net_investment_income: float,
                                           traditional_withdrawal: float,
                                           filing_status: str = "married_filing_jointly") -> Dict:
              """Analyze NIIT impact and suggest optimization"""
              
              niit_params = load_niit_thresholds(filing_status)
              threshold = niit_params['threshold']
              
              # Calculate NIIT with current plan
              current_magi = base_magi + traditional_withdrawal
              current_niit, current_details = calculate_niit(
                  net_investment_income,
                  current_magi,
                  filing_status
              )
              
              # Key insight: Traditional IRA withdrawals increase MAGI but are NOT subject to NIIT
              # However, higher MAGI can trigger NIIT on investment income
              
              analysis = {
                  'current_magi': current_magi,
                  'threshold': threshold,
                  'distance_to_threshold': threshold - current_magi,
                  'over_threshold': current_magi > threshold,
                  'current_niit': current_niit,
                  'net_investment_income': net_investment_income,
                  'traditional_withdrawal': traditional_withdrawal
              }
              
              # Recommendations
              if current_magi < threshold:
                  # Below threshold - no NIIT concern
                  analysis['recommendation'] = "Below NIIT threshold - no optimization needed"
                  analysis['optimal_strategy'] = "Continue with planned withdrawals"
                  
              elif current_magi > threshold and net_investment_income > 0:
                  # Over threshold with investment income - NIIT applies
                  # Prefer retirement account withdrawals over taxable account
                  analysis['recommendation'] = "Prefer Traditional IRA withdrawals over taxable account"
                  analysis['rationale'] = (
                      "Traditional IRA withdrawals increase MAGI but are NOT subject to NIIT. "
                      "Taxable account gains ARE subject to NIIT (effective rate up to 23.8%)."
                  )
                  analysis['optimal_strategy'] = (
                      "Maximize Traditional IRA withdrawals, minimize taxable account gains"
                  )
                  
                  # Calculate potential savings
                  if net_investment_income > 0:
                      potential_niit_on_gains = net_investment_income * 0.038
                      analysis['potential_niit_savings'] = potential_niit_on_gains
                      
              return analysis
      
      integrate_niit_with_stages:
        description: "Add NIIT calculations to stage strategies"
        changes_required:
          - "Import calculate_niit() and calculate_net_investment_income()"
          - "Calculate NII from taxable account activity"
          - "Calculate NIIT in each stage's calculate_strategy()"
          - "Add niit_amount field to YearlyStrategy dataclass"
          - "Optimize withdrawal sequencing to minimize NIIT"
        
        example_integration: |
          # In each stage's calculate_strategy():
          
          # Calculate net investment income from taxable account
          net_investment_income = calculate_net_investment_income(
              interest=taxable_interest,
              dividends=taxable_dividends,
              capital_gains=ltcg_harvested,
              rental_income=0,
              royalties=0
          )
          
          # Calculate MAGI
          magi = (
              wages +
              ss_benefits * 0.85 +  # Simplified SS taxation
              traditional_withdrawal +
              roth_conversion +
              net_investment_income
          )
          
          # Calculate NIIT
          niit_amount, niit_details = calculate_niit(
              net_investment_income=net_investment_income,
              magi=magi,
              filing_status='married_filing_jointly'
          )
          
          # Optimize withdrawals if near NIIT threshold
          if magi > 240000:  # Within $10K of threshold
              niit_analysis = optimize_withdrawals_for_niit(
                  base_magi=magi - traditional_withdrawal,
                  net_investment_income=net_investment_income,
                  traditional_withdrawal=traditional_withdrawal,
                  filing_status='married_filing_jointly'
              )
              
              logger.info(f"Year {year}: {niit_analysis['recommendation']}")
          
          # Add to YearlyStrategy
          return YearlyStrategy(
              # ... existing fields ...
              net_investment_income=net_investment_income,
              niit_amount=niit_amount,
              niit_details=niit_details,
              total_tax=federal_tax + state_tax + amt_owed + niit_amount
          )
    
    stage_specific_strategies:
      stage_2_early_retirement:
        niit_consideration: "High risk - large Roth conversions increase MAGI"
        strategy: |
          # Balance Roth conversions with NIIT impact
          if magi_with_conversion > niit_threshold:
              # Consider reducing conversion to stay below threshold
              # OR accept NIIT as cost of conversion opportunity
              niit_cost = calculate_niit(nii, magi_with_conversion)
              conversion_benefit = calculate_conversion_benefit(conversion_amount)
              
              if conversion_benefit > niit_cost:
                  # Proceed with conversion despite NIIT
                  logger.info("Conversion benefit exceeds NIIT cost")
              else:
                  # Reduce conversion to avoid NIIT
                  optimal_conversion = find_conversion_below_niit_threshold()
        
      stage_3_medicare:
        niit_consideration: "Coordinate with IRMAA thresholds"
        strategy: |
          # IRMAA thresholds often align with NIIT considerations
          # Optimize for both simultaneously
          if magi > niit_threshold:
              # Prefer Traditional withdrawals over taxable gains
              # Reduces NIIT while managing IRMAA
              withdrawal_sequence = ['Traditional', 'Roth', 'Taxable']
        
      stage_4_social_security:
        niit_consideration: "SS benefits increase MAGI but not subject to NIIT"
        strategy: |
          # SS increases MAGI, potentially triggering NIIT on investment income
          # Prefer retirement account withdrawals over taxable
          if magi_with_ss > niit_threshold:
              minimize_taxable_account_gains()
              maximize_traditional_withdrawals()
        
      stage_5_rmd:
        niit_consideration: "RMDs increase MAGI but not subject to NIIT"
        strategy: |
          # Large RMDs may push MAGI over threshold
          # Use QCDs to reduce MAGI and avoid NIIT
          if magi_with_rmd > niit_threshold:
              qcd_amount = min(rmd_amount, charitable_intent)
              magi_after_qcd = magi_with_rmd - qcd_amount
              niit_savings = calculate_niit_savings(qcd_amount)
    
    testing_requirements:
      unit_tests:
        - "test_load_niit_thresholds() - Verify thresholds"
        - "test_calculate_net_investment_income() - Sum NII components"
        - "test_calculate_niit_below_threshold() - No NIIT"
        - "test_calculate_niit_above_threshold() - NIIT applies"
        - "test_niit_with_large_conversion() - Conversion triggers NIIT"
        - "test_optimize_withdrawals_for_niit()"
        
      integration_tests:
        - "test_niit_in_stage_2_with_conversions()"
        - "test_niit_coordination_with_irmaa()"
        - "test_niit_with_ss_benefits_stage_4()"
        - "test_niit_avoidance_with_qcds_stage_5()"
        - "test_multi_year_niit_optimization()"
    
    estimated_effort:
      data_file_setup: "1 hour (simple thresholds)"
      function_implementation: "3-4 hours"
      integration: "2-3 hours"
      testing: "2-3 hours"
      total: "8-11 hours"

      
      strategies:
        - strategy: "Use Roth IRA withdrawals instead of taxable account"
          benefit: "Roth withdrawals don't increase MAGI"
          application: "When near threshold, prefer Roth over taxable"
          
        - strategy: "Defer capital gains harvesting"
          benefit: "Avoid increasing net investment income"
          timing: "Harvest gains in years with lower MAGI"
          
        - strategy: "Manage Roth conversion amounts"
          benefit: "Keep MAGI below threshold"
          trade_off: "May limit conversion opportunities"
          
        - strategy: "Bunch deductions"
          benefit: "Lower AGI/MAGI in alternating years"
          method: "Charitable contributions, medical expenses"
          
    income_source_optimization:
      hierarchy_when_near_threshold:
        1: "Roth IRA withdrawals (no MAGI impact, no NIIT)"
        2: "Traditional IRA withdrawals (MAGI impact but no NIIT)"
        3: "Capital gains from taxable (MAGI impact AND NIIT)"
        
      rationale: |
        Even though Traditional IRA increases MAGI, the distribution itself
        is not subject to NIIT. Only the investment income in taxable accounts
        is subject to NIIT.
        
    roth_conversion_optimization:
      consideration: "Conversions increase MAGI, potentially triggering NIIT"
      
      calculation_approach: |
        # Calculate total tax impact including NIIT
        base_magi = ss_benefits + other_income
        proposed_conversion = 100000
        
        magi_with_conversion = base_magi + proposed_conversion
        
        # Calculate NIIT impact
        if magi_with_conversion > niit_threshold:
            excess = magi_with_conversion - niit_threshold
            niit_on_investment_income = min(net_investment_income, excess) * 0.038
        else:
            niit_on_investment_income = 0
            
        # Total tax = regular tax + NIIT
        total_tax = federal_income_tax + niit_on_investment_income
        
      optimization: |
        # Find conversion amount that maximizes benefit
        # while considering NIIT impact
        optimal_conversion = find_conversion_minimizing_total_tax(
            base_magi,
            net_investment_income,
            niit_threshold,
            tax_brackets
        )
        
    capital_gains_harvesting:
      issue: "LTCG harvesting increases both MAGI and net investment income"
      
      strategy: "Harvest gains only when MAGI well below threshold"
      
      calculation: |
        # Check if harvesting would trigger NIIT
        current_magi = base_income
        proposed_harvest = 50000
        
        if current_magi + proposed_harvest > niit_threshold:
            # Calculate NIIT cost
            excess = (current_magi + proposed_harvest) - niit_threshold
            niit_cost = min(proposed_harvest, excess) * 0.038
            
            # Compare to benefit of 0% LTCG rate
            if niit_cost > 0:
                # May not be worth harvesting
                reduce_or_defer_harvest()
                
  stage_specific_strategies:
    stage_2_early_retirement:
      typical_situation: "MAGI often below threshold due to no wages"
      opportunity: "Aggressive LTCG harvesting without NIIT concern"
      strategy: |
        # Harvest gains up to threshold
        available_room = niit_threshold - current_magi
        harvest_amount = min(available_room, desired_harvest)
        
    stage_3_medicare:
      consideration: "Balance NIIT with IRMAA penalties"
      complexity: "Both triggered by high MAGI"
      strategy: |
        # Find sweet spot that minimizes total cost
        # IRMAA penalties vs NIIT vs conversion benefits
        optimal_magi = optimize_for_irmaa_and_niit(
            base_income,
            irmaa_thresholds,
            niit_threshold,
            conversion_opportunities
        )
        
    stage_4_social_security:
      challenge: "SS benefits increase MAGI"
      strategy: "Use Roth withdrawals to supplement SS"
      benefit: "Avoid both NIIT and additional SS taxation"
      
    stage_5_rmd:
      situation: "RMDs increase MAGI but not subject to NIIT"
      strategy: "RMDs may push into NIIT territory for investment income"
      approach: |
        # Use RMDs to fund expenses
        # Minimize taxable account withdrawals
        # Preserve Roth for years with high RMDs
        
  implementation_approach:
    data_requirements:
      - niit_thresholds: "By filing status and year"
      - net_investment_income: "Interest, dividends, capital gains from taxable accounts"
      - magi: "Modified Adjusted Gross Income"
      - filing_status: "Determines threshold"
      
    calculation_integration:
      calculate_niit: |
        def calculate_niit(magi, net_investment_income, filing_status, year):
            threshold = get_niit_threshold(filing_status, year)
            
            if magi <= threshold:
                return 0
                
            excess_magi = magi - threshold
            niit_base = min(net_investment_income, excess_magi)
            niit = niit_base * 0.038
            
            return niit
            
      integrate_with_strategy: |
        # In each stage calculation
        total_tax = federal_income_tax + state_tax + niit + irmaa_penalty
        
        # Optimize considering all tax components
        optimal_strategy = minimize_total_tax(
            withdrawal_options,
            conversion_options,
            harvest_options

