# ==============================================================================
# ACCOUNT REBALANCING IMPLEMENTATION (NEW FEATURE)
# ==============================================================================

account_rebalancing:
  priority: "CRITICAL"
  status: "Documented - Ready for Implementation"
  version: "2.0"
  
  overview:
    description: |
      Comprehensive account rebalancing logic that implements actual fund movements
      between portfolio accounts to maintain buffer targets and execute withdrawal/
      conversion strategies. This feature addresses the critical gap where the module
      calculates taxes and conversions but does not move funds between accounts.
      
    key_objectives:
      - Maintain 2-year cash buffer for expense coverage
      - Maintain 3-year taxable (brokerage) buffer for medium-term needs
      - Execute Roth conversions with actual fund transfers
      - Implement tax-efficient withdrawal sequencing
      - Track all fund movements for reporting and tax calculations
      - Ensure conservation of funds (all movements balance to zero)
      
    integration_points:
      - All 5 life stage calculate_strategy() methods
      - YearlyStrategy dataclass (add tracking fields)
      - Tax calculation functions (reflect actual distributions)
      - Multi-year projection engine
      - Streamlit reporting and visualization
  
  buffer_maintenance:
    cash_buffer:
      target: "2 years of annual expenses"
      trigger: "cash < expenses * 2.0"
      priority: "HIGH - Critical for expense coverage"
      
      replenishment_sequence:
        step_1:
          source: "Taxable (Brokerage)"
          destination: "Cash"
          amount: "min(cash_deficit, brokerage_available)"
          tax_impact: "None (already in taxable account)"
          notes: "Preferred source - no tax impact, liquid assets"
          
        step_2:
          source: "Traditional IRA/401k"
          destination: "Cash"
          amount: "min(cash_deficit, traditional_available)"
          tax_impact: "Ordinary income tax on distribution"
          notes: "Secondary source - triggers income tax"
          considerations:
            - "Check if distribution pushes into higher tax bracket"
            - "Consider IRMAA impact (2-year lookback)"
            - "Coordinate with Roth conversion strategy"
            
        step_3:
          source: "Roth IRA"
          destination: "Cash"
          amount: "cash_deficit (emergency only)"
          tax_impact: "None (tax-free qualified distribution after 59.5)"
          notes: "Last resort - preserve Roth for heirs and tax-free growth"
          conditions:
            - "Only if Traditional and Taxable depleted"
            - "Age 59.5+ for qualified distributions"
            - "Log warning when Roth used for expenses"
      
      implementation_logic: |
        def replenish_cash_buffer(balances: PortfolioBalances, 
                                 expenses: float,
                                 age_primary: int,
                                 year: int) -> Tuple[PortfolioBalances, Dict]:
            """
            Replenish cash buffer to 2-year target
            
            Returns:
                Tuple of (updated_balances, transaction_log)
            """
            cash_target = expenses * 2.0
            cash_deficit = max(0, cash_target - balances.cash)
            
            if cash_deficit < 100:  # Ignore trivial amounts
                return balances, {}
            
            transactions = {
                'brokerage_to_cash': 0.0,
                'traditional_to_cash': 0.0,
                'roth_to_cash': 0.0,
                'total_replenished': 0.0
            }
            
            # Step 1: Transfer from Brokerage (tax-free)
            if cash_deficit > 0 and balances.taxable > 0:
                transfer = min(cash_deficit, balances.taxable)
                balances.taxable -= transfer
                balances.cash += transfer
                transactions['brokerage_to_cash'] = transfer
                cash_deficit -= transfer
                logger.info(f"Year {year}: Transferred ${transfer:,.0f} from Brokerage to Cash")
            
            # Step 2: Distribute from Traditional (taxable)
            if cash_deficit > 0 and balances.traditional > 0:
                distribution = min(cash_deficit, balances.traditional * 0.10)  # Max 10% per year
                balances.traditional -= distribution
                balances.cash += distribution
                transactions['traditional_to_cash'] = distribution
                cash_deficit -= distribution
                logger.info(f"Year {year}: Distributed ${distribution:,.0f} from Traditional to Cash (taxable)")
            
            # Step 3: Emergency Roth distribution (tax-free if qualified)
            if cash_deficit > 0 and balances.roth > 0 and age_primary >= 59.5:
                distribution = min(cash_deficit, balances.roth * 0.05)  # Max 5% per year
                balances.roth -= distribution
                balances.cash += distribution
                transactions['roth_to_cash'] = distribution
                logger.warning(f"Year {year}: EMERGENCY - Distributed ${distribution:,.0f} from Roth to Cash")
            
            transactions['total_replenished'] = sum([
                transactions['brokerage_to_cash'],
                transactions['traditional_to_cash'],
                transactions['roth_to_cash']
            ])
            
            return balances, transactions
    
    brokerage_buffer:
      target: "3 years of annual expenses"
      trigger: "taxable < expenses * 3.0"
      priority: "MEDIUM - Important for medium-term liquidity"
      
      replenishment_sequence:
        step_1:
          source: "Traditional IRA/401k"
          destination: "Taxable (Brokerage)"
          amount: "min(brokerage_deficit, traditional_available)"
          tax_impact: "Ordinary income tax on distribution"
          notes: "Primary source for brokerage replenishment"
          strategy: "Coordinate with Roth conversion strategy to optimize taxes"
          
        step_2:
          source: "Roth IRA"
          destination: "Taxable (Brokerage)"
          amount: "brokerage_deficit (emergency only)"
          tax_impact: "None (tax-free qualified distribution)"
          notes: "Emergency only - preserve Roth growth"
          conditions:
            - "Only if Traditional depleted"
            - "Age 59.5+ for qualified distributions"
      
      implementation_logic: |
        def replenish_brokerage_buffer(balances: PortfolioBalances,
                                       expenses: float,
                                       age_primary: int,
                                       year: int) -> Tuple[PortfolioBalances, Dict]:
            """
            Replenish brokerage buffer to 3-year target
            
            Returns:
                Tuple of (updated_balances, transaction_log)
            """
            brokerage_target = expenses * 3.0
            brokerage_deficit = max(0, brokerage_target - balances.taxable)
            
            if brokerage_deficit < 100:
                return balances, {}
            
            transactions = {
                'traditional_to_brokerage': 0.0,
                'roth_to_brokerage': 0.0,
                'total_replenished': 0.0
            }
            
            # Step 1: Distribute from Traditional (taxable)
            if brokerage_deficit > 0 and balances.traditional > 0:
                distribution = min(brokerage_deficit, balances.traditional * 0.15)  # Max 15% per year
                balances.traditional -= distribution
                balances.taxable += distribution
                transactions['traditional_to_brokerage'] = distribution
                brokerage_deficit -= distribution
                logger.info(f"Year {year}: Distributed ${distribution:,.0f} from Traditional to Brokerage (taxable)")
            
            # Step 2: Emergency Roth distribution (tax-free if qualified)
            if brokerage_deficit > 0 and balances.roth > 0 and age_primary >= 59.5:
                distribution = min(brokerage_deficit, balances.roth * 0.05)  # Max 5% per year
                balances.roth -= distribution
                balances.taxable += distribution
                transactions['roth_to_brokerage'] = distribution
                logger.warning(f"Year {year}: EMERGENCY - Distributed ${distribution:,.0f} from Roth to Brokerage")
            
            transactions['total_replenished'] = sum([
                transactions['traditional_to_brokerage'],
                transactions['roth_to_brokerage']
            ])
            
            return balances, transactions
  
  roth_conversion_execution:
    description: |
      Execute actual fund transfers for Roth conversions calculated by BETR algorithm.
      Currently, the module calculates optimal conversion amounts but does not move funds.
      
    current_issue:
      problem: "Conversion amount calculated but funds not transferred"
      example: |
        # Current (INCORRECT):
        roth_conversion = 50000  # Calculated by BETR
        new_balances = PortfolioBalances(
            traditional=balances.traditional,  # Should be -= 50000
            roth=balances.roth,                # Should be += 50000
            ...
        )
        
        # Fixed (CORRECT):
        roth_conversion = 50000
        new_balances = PortfolioBalances(
            traditional=balances.traditional - roth_conversion,
            roth=balances.roth + roth_conversion,
            ...
        )
    
    implementation:
      function_name: "execute_roth_conversion()"
      parameters:
        - "balances: PortfolioBalances"
        - "conversion_amount: float"
        - "year: int"
      returns: "Updated PortfolioBalances"
      
      logic: |
        def execute_roth_conversion(balances: PortfolioBalances,
                                   conversion_amount: float,
                                   year: int) -> PortfolioBalances:
            """
            Execute Roth conversion by moving funds from Traditional to Roth
            
            Args:
                balances: Current portfolio balances
                conversion_amount: Amount to convert (from BETR algorithm)
                year: Current year
            
            Returns:
                Updated balances with conversion executed
            """
            if conversion_amount <= 0:
                return balances
            
            # Verify sufficient Traditional balance
            if balances.traditional < conversion_amount:
                logger.warning(f"Year {year}: Insufficient Traditional balance for conversion "
                             f"(requested: ${conversion_amount:,.0f}, available: ${balances.traditional:,.0f})")
                conversion_amount = balances.traditional
            
            # Execute conversion
            balances.traditional -= conversion_amount
            balances.roth += conversion_amount
            
            logger.info(f"Year {year}: Converted ${conversion_amount:,.0f} from Traditional to Roth")
            logger.debug(f"  Traditional: ${balances.traditional:,.0f}, Roth: ${balances.roth:,.0f}")
            
            return balances
      
      tax_implications:
        - "Conversion amount added to ordinary income"
        - "May push into higher tax bracket"
        - "IRMAA impact (2-year lookback for Medicare)"
        - "ACA subsidy impact (if applicable)"
        - "Tax paid from taxable account (preferred) or cash"
  
  withdrawal_sequencing:
    description: |
      Implement tax-efficient withdrawal sequencing across all account types.
      Order of withdrawals optimized for tax efficiency and buffer maintenance.
      
    general_sequence:
      priority_1:
        account: "Cash"
        reason: "No tax impact, immediate liquidity"
        limit: "Down to 1-year expenses (maintain minimum buffer)"
        
      priority_2:
        account: "Taxable (Brokerage)"
        reason: "Preferential LTCG rates, no RMD impact"
        limit: "Down to 2-year expenses (maintain buffer)"
        tax: "Long-term capital gains (0%, 15%, or 20%)"
        
      priority_3:
        account: "Traditional IRA/401k"
        reason: "Ordinary income tax, reduces future RMDs"
        limit: "Up to top of target tax bracket"
        tax: "Ordinary income tax"
        considerations:
          - "IRMAA thresholds (Medicare)"
          - "ACA subsidy cliffs (early retirement)"
          - "Social Security taxation"
          
      priority_4:
        account: "Roth IRA"
        reason: "Tax-free, preserve for heirs"
        limit: "Emergency only"
        tax: "None (qualified distributions)"
        notes: "Last resort - maximize tax-free growth"
    
    stage_specific_sequences:
      stage_1_accumulation:
        focus: "Build buffers, maximize contributions"
        sequence:
          - "Contribute to 401k/IRA (tax-deferred)"
          - "Max out Roth contributions"
          - "Build cash buffer (2 years)"
          - "Build taxable buffer (3 years)"
          - "Consider Roth conversions if in low tax bracket"
          
      stage_2_early_retirement:
        focus: "Aggressive Roth conversions, ACA optimization"
        sequence:
          - "Maintain cash buffer from taxable"
          - "Harvest LTCG at 0% rate"
          - "Aggressive Roth conversions (BETR-optimized)"
          - "Minimize MAGI for ACA subsidies"
          - "Distribute from Traditional to fund lifestyle"
          
      stage_3_medicare:
        focus: "IRMAA optimization, continued conversions"
        sequence:
          - "Maintain buffers"
          - "Roth conversions below IRMAA thresholds"
          - "Harvest LTCG strategically"
          - "Balance Traditional withdrawals with IRMAA"
          
      stage_4_social_security:
        focus: "Balance SS taxation with conversions"
        sequence:
          - "Maintain buffers"
          - "Coordinate SS benefits with other income"
          - "Continue Roth conversions (BETR-optimized)"
          - "Manage IRMAA with 2-year lookback"
          
      stage_5_rmd:
        focus: "RMD compliance, tax-efficient distributions"
        sequence:
          - "Satisfy RMD requirements"
          - "Distribute excess RMD to taxable"
          - "QCD for charitable giving (if applicable)"
          - "Maintain buffers from RMD distributions"
  
  fund_movement_tracking:
    description: |
      Track all fund movements for reporting, tax calculations, and audit trail.
      Add new fields to YearlyStrategy dataclass to capture all transactions.
      
    new_fields:
      cash_replenishment:
        type: "float"
        description: "Total amount added to cash buffer this year"
        components:
          - "brokerage_to_cash"
          - "traditional_to_cash"
          - "roth_to_cash"
          
      brokerage_replenishment:
        type: "float"
        description: "Total amount added to brokerage buffer this year"
        components:
          - "traditional_to_brokerage"
          - "roth_to_brokerage"
          
      traditional_to_cash:
        type: "float"
        description: "Traditional IRA distributions to cash"
        tax_impact: "Ordinary income"
        
      traditional_to_brokerage:
        type: "float"
        description: "Traditional IRA distributions to brokerage"
        tax_impact: "Ordinary income"
        
      brokerage_to_cash:
        type: "float"
        description: "Brokerage transfers to cash"
        tax_impact: "None (already taxable)"
        
      roth_to_cash:
        type: "float"
        description: "Roth IRA distributions to cash (emergency)"
        tax_impact: "None (qualified)"
        
      roth_to_brokerage:
        type: "float"
        description: "Roth IRA distributions to brokerage (emergency)"
        tax_impact: "None (qualified)"
        
      conversion_executed:
        type: "float"
        description: "Actual Roth conversion executed (Traditional → Roth)"
        tax_impact: "Ordinary income"
        
      total_fund_movements:
        type: "float"
        description: "Sum of all fund movements (should net to zero)"
        validation: "Ensure conservation of funds"
    
    dataclass_update: |
      @dataclass
      class YearlyStrategy:
          """Container for a year's withdrawal strategy"""
          # ... existing fields ...
          
          # NEW: Fund movement tracking
          cash_replenishment: float = 0.0
          brokerage_replenishment: float = 0.0
          traditional_to_cash: float = 0.0
          traditional_to_brokerage: float = 0.0
          brokerage_to_cash: float = 0.0
          roth_to_cash: float = 0.0
          roth_to_brokerage: float = 0.0
          conversion_executed: float = 0.0
          
          def validate_fund_conservation(self) -> bool:
              """
              Verify that all fund movements balance to zero
              (what leaves one account enters another)
              """
              # Outflows (negative)
              outflows = (
                  self.traditional_to_cash +
                  self.traditional_to_brokerage +
                  self.brokerage_to_cash +
                  self.roth_to_cash +
                  self.roth_to_brokerage +
                  self.conversion_executed  # Traditional → Roth
              )
              
              # Inflows (positive)
              inflows = (
                  self.cash_replenishment +
                  self.brokerage_replenishment +
                  self.conversion_executed  # → Roth
              )
              
              # Should balance (within rounding)
              balance = abs(outflows - inflows)
              if balance > 1.0:  # Allow $1 rounding error
                  logger.error(f"Fund conservation violated: ${balance:,.2f} imbalance")
                  return False
              
              return True
  
  helper_function:
    name: "rebalance_accounts()"
    purpose: "Centralized account rebalancing logic"
    location: "Add to strategy.py after calculate_niit()"
    
    signature: |
      def rebalance_accounts(balances: PortfolioBalances,
                            expenses: float,
                            roth_conversion: float,
                            year: int,
                            age_primary: int,
                            stage: str) -> Tuple[PortfolioBalances, Dict[str, float]]:
          """
          Execute all account rebalancing operations for a given year
          
          This function orchestrates:
          1. Cash buffer maintenance (2-year target)
          2. Brokerage buffer maintenance (3-year target)
          3. Roth conversion execution
          4. Fund movement tracking
          
          Args:
              balances: Current portfolio balances
              expenses: Annual expenses for this year
              roth_conversion: Roth conversion amount (from BETR algorithm)
              year: Current year
              age_primary: Primary person's age
              stage: Current life stage
          
          Returns:
              Tuple of (updated_balances, transaction_log)
              - updated_balances: PortfolioBalances after all movements
              - transaction_log: Dict with all fund movements for reporting
          """
    
    implementation: |
      def rebalance_accounts(balances: PortfolioBalances,
                            expenses: float,
                            roth_conversion: float,
                            year: int,
                            age_primary: int,
                            stage: str) -> Tuple[PortfolioBalances, Dict[str, float]]:
          """Execute all account rebalancing operations"""
          
          logger.info(f"Year {year} ({stage}): Starting account rebalancing")
          logger.debug(f"  Initial balances: Cash=${balances.cash:,.0f}, "
                      f"Taxable=${balances.taxable:,.0f}, "
                      f"Traditional=${balances.traditional:,.0f}, "
                      f"Roth=${balances.roth:,.0f}")
          
          # Initialize transaction log
          transactions = {
              'brokerage_to_cash': 0.0,
              'traditional_to_cash': 0.0,
              'traditional_to_brokerage': 0.0,
              'roth_to_cash': 0.0,
              'roth_to_brokerage': 0.0,
              'conversion_executed': 0.0,
              'cash_replenishment': 0.0,
              'brokerage_replenishment': 0.0
          }
          
          # Step 1: Execute Roth conversion
          if roth_conversion > 0:
              balances = execute_roth_conversion(balances, roth_conversion, year)
              transactions['conversion_executed'] = roth_conversion
          
          # Step 2: Replenish cash buffer
          balances, cash_txns = replenish_cash_buffer(balances, expenses, age_primary, year)
          transactions.update(cash_txns)
          
          # Step 3: Replenish brokerage buffer
          balances, brokerage_txns = replenish_brokerage_buffer(balances, expenses, age_primary, year)
          transactions.update(brokerage_txns)
          
          # Step 4: Validate fund conservation
          total_movements = sum([
              transactions['brokerage_to_cash'],
              transactions['traditional_to_cash'],
              transactions['traditional_to_brokerage'],
              transactions['roth_to_cash'],
              transactions['roth_to_brokerage']
          ])
          
          logger.info(f"Year {year}: Rebalancing complete - ${total_movements:,.0f} total movements")
          logger.debug(f"  Final balances: Cash=${balances.cash:,.0f}, "
                      f"Taxable=${balances.taxable:,.0f}, "
                      f"Traditional=${balances.traditional:,.0f}, "
                      f"Roth=${balances.roth:,.0f}")
          
          return balances, transactions
  
  stage_integration:
    description: |
      Update all 5 life stage calculate_strategy() methods to call rebalance_accounts()
      and incorporate fund movements into balance calculations and tax reporting.
      
    changes_required:
      all_stages:
        - "Import rebalance_accounts() function"
        - "Call rebalance_accounts() after calculating conversions/withdrawals"
        - "Update balance calculations to use returned balances"
        - "Add transaction log fields to YearlyStrategy"
        - "Update tax calculations to include distribution taxes"
        
      example_integration: |
        def calculate_strategy(self, year: int, balances: PortfolioBalances,
                              expenses: float, ...) -> YearlyStrategy:
            """Calculate strategy for this stage"""
            
            # ... existing logic to calculate roth_conversion ...
            
            # NEW: Execute account rebalancing
            updated_balances, transactions = rebalance_accounts(
                balances=balances,
                expenses=expenses,
                roth_conversion=roth_conversion,
                year=year,
                age_primary=age_primary,
                stage=self.name
            )
            
            # NEW: Create strategy with fund movement tracking
            return YearlyStrategy(
                year=year,
                # ... existing fields ...
                roth_conversion=roth_conversion,
                balances=updated_balances,  # Use updated balances
                
                # NEW: Fund movement tracking
                cash_replenishment=transactions['cash_replenishment'],
                brokerage_replenishment=transactions['brokerage_replenishment'],
                traditional_to_cash=transactions['traditional_to_cash'],
                traditional_to_brokerage=transactions['traditional_to_brokerage'],
                brokerage_to_cash=transactions['brokerage_to_cash'],
                roth_to_cash=transactions['roth_to_cash'],
