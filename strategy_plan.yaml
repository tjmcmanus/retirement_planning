# Retirement Portfolio Withdrawal Strategy - Implementation Plan
# 5-Stage Life Cycle Approach
# Author: IBM Bob
# Date: 2026-02-24

metadata:
  module_name: strategy.py
  version: "1.0"
  created: "2026-02-22"
  last_reviewed: "2026-02-24"
  purpose: "Comprehensive retirement withdrawal strategy across 5 life stages with tax optimization"
  integration: "Streamlit retirement planning application"

# ==============================================================================
# OVERVIEW
# ==============================================================================

overview:
  description: |
    A sophisticated withdrawal strategy module that adapts to different life stages,
    optimizing for tax efficiency using the BETR (Break-Even Tax Rate) algorithm for
    Roth conversions, IRMAA management, and ACA subsidies. Based on Vanguard research
    (July 2025) for optimal conversion decisions.
    
  key_features:
    - Multi-stage lifecycle approach (5 distinct stages)
    - BETR algorithm for optimal Roth conversion decisions
    - RMD lookback optimization (adjust early conversions to reduce future RMDs)
    - Tax-optimized Roth conversion ladder using break-even analysis
    - IRMAA threshold management with 2-year lookback
    - ACA subsidy optimization for early retirees
    - Long-term capital gains harvesting at 0% rate
    - RMD compliance and optimization
    - 4% sustainable withdrawal rate
    - Cash buffer management (2 years cash + 3 years taxable)
    - State tax, AMT, and NIIT planning frameworks

  life_stages:
    stage_1:
      name: "Accumulation"
      trigger: "Has wages/employment income"
      focus: "Tax-efficient contributions and asset building, tax-loss harvesting, Roth Conversion based on BETR algorythm to reduce RMDs in Stage 5"
      
    stage_2:
      name: "Early Retirement"
      trigger: "No wages, pre-Medicare, pre-SS, pre-RMD"
      focus: "use traditional, brokerage and cash accounts to fund lifestyle, Aggressive Roth conversions based on BETR algorythm to reduce RMDs in Stage 5, ACA optimization if applicable and tax-loss harvesting"
      
    stage_3:
      name: "Medicare"
      trigger: "No wages,Age 65+, on Medicare, pre-SS, pre-RMD"
      focus: "use traditional, brokerage and cash accounts to fund lifestyle, IRMAA optimization while continuing roth conversions to reduce RMDs in Stage 5"
      
    stage_4:
      name: "Social Security"
      trigger: "Collecting SS benefits, pre-RMD"
      focus: "Balance SS taxation with IRMAA and coRoth conversions based on BETR algorythm to reduce RMDs in Stage 5"
      
    stage_5:
      name: "RMD"
      trigger: "Age 73+ (SECURE Act 2.0)"
      focus: "RMD compliance and tax-efficient distributions"

# ==============================================================================
# ARCHITECTURE
# ==============================================================================

architecture:
  design_pattern: "Strategy Pattern"
  description: |
    Uses polymorphic LifeStage classes that implement stage-specific withdrawal logic.
    WithdrawalStrategyEngine orchestrates stage determination and multi-year projections.
    
  core_components:
    data_classes:
      - name: "PortfolioBalances"
        purpose: "Container for 5 account types"
        fields:
          - cash: "Checking/savings/cash accounts"
          - taxable: "Brokerage accounts"
          - traditional: "401k, Traditional IRA (tax-deferred)"
          - roth: "Roth IRA, Roth 401k (tax-free)"
          - daf: "Donor Advised Fund"
        methods:
          - total(): "Sum of all account balances"
          
      - name: "YearlyStrategy"
        purpose: "Complete strategy for a single year"
        fields:
          year: "Calendar year"
          age_primary: "Primary person age"
          age_spouse: "Spouse age"
          stage: "Life stage name"
          wages: "W-2 employment income"
          ss_benefits: "Social Security benefits"
          rmd_amount: "Required Minimum Distribution"
          traditional_withdrawal: "Traditional IRA withdrawals"
          taxable_withdrawal: "Taxable account withdrawals"
          roth_withdrawal: "Roth IRA withdrawals"
          roth_conversion: "Traditional → Roth conversion amount"
          ltcg_harvested: "Long-term capital gains harvested"
          daf_contribution: "Donor Advised Fund contributions"
          expenses: "Annual living expenses"
          federal_tax: "Federal income tax"
          irmaa_penalty: "Medicare IRMAA surcharge"
          aca_premium: "ACA marketplace premium"
          balances: "End-of-year PortfolioBalances"
    
    base_classes:
      - name: "LifeStage"
        type: "Abstract base class"
        methods:
          - applies(): "Determines if stage applies to current situation"
          - calculate_strategy(): "Computes optimal withdrawal strategy"
        
    stage_implementations:
      - class: "Stage1Accumulation"
        inherits: "LifeStage"
        trigger_logic: "has_wages == True"
        
      - class: "Stage2EarlyRetirement"
        inherits: "LifeStage"
        trigger_logic: "not has_wages and not has_ss and age < 65"
        
      - class: "Stage3Medicare"
        inherits: "LifeStage"
        trigger_logic: "not has_wages and not has_ss and age >= 65 and age < 73"
        
      - class: "Stage4SocialSecurity"
        inherits: "LifeStage"
        trigger_logic: "has_ss and age < 73"
        
      - class: "Stage5RMD"
        inherits: "LifeStage"
        trigger_logic: "age >= 73"
    
    engine:
      - name: "WithdrawalStrategyEngine"
        purpose: "Orchestrates multi-year strategy calculation"
        methods:
          - determine_stage(): "Selects applicable LifeStage"
          - calculate_multi_year_strategy(): "Projects 25+ years"
          - _strategies_to_dataframe(): "Converts to pandas DataFrame"

# ==============================================================================
# STAGE 1: ACCUMULATION
# ==============================================================================

stage_1_accumulation:
  name: "Stage 1: Accumulation"
  description: "Employed, earning wages, building retirement assets"
  
  trigger_conditions:
    - has_wages: true
    
  objectives:
    primary: "Maximize tax-efficient contributions"
    secondary:
      - "Build emergency fund"
      - "Optimize Roth vs Traditional contributions"
      - "Maximize employer match"
      
  strategy:
    contributions:
      traditional_401k: "Pre-tax contributions reduce current AGI"
      roth_401k: "After-tax contributions for tax-free growth"
      decision_criteria: "Based on current tax bracket vs expected retirement bracket"
      
    withdrawals:
      policy: "No withdrawals during accumulation"
      exceptions: "Emergency fund access only"
      
    tax_optimization:
      - "Maximize pre-tax contributions if in high bracket (24%+)"
      - "Consider Roth contributions if in low bracket (12%)"
      - "Utilize standard deduction fully"
      
  implementation_details:
    key_calculations:
      - "AGI = wages - traditional_401k_contribution"
      - "Taxable income = AGI - standard_deduction"
      - "Federal tax = calculate_taxable_income(taxable_income, tax_brackets)"
      
    balance_updates:
      - "traditional += contribution_401k"
      - "roth += contribution_roth"
      - "No withdrawals from any account"

# ==============================================================================
# STAGE 2: EARLY RETIREMENT
# ==============================================================================

stage_2_early_retirement:
  name: "Stage 2: Early Retirement"
  description: "Pre-Medicare, pre-SS, pre-RMD - Prime Roth conversion window"
  
  trigger_conditions:
    - has_wages: false
    - has_ss: false
    - age_primary: "< 65"
    - age_spouse: "< 65"
    
  objectives:
    primary: "Aggressive Roth conversions to fill lower tax brackets"
    secondary:
      - "Harvest LTCG at 0% rate"
      - "Optimize for ACA subsidies (< 400% FPL)"
      - "Build cash buffer (2 years expenses)"
      - "Build taxable buffer (3 years expenses)"
      - "Implement 4% withdrawal rate"
      
  strategy:
    cash_buffer_management:
      cash_target: "2 years of expenses"
      taxable_target: "3 years of expenses"
      ramp_up_period: "3 years to reach targets"
      calculation: "calculate_cash_buffer_targets(expenses)"
      purpose: "Avoid forced sales during market downturns"
      
    roth_conversion_ladder:
      approach: "Use BETR (Break-Even Tax Rate) algorithm to optimize conversions"
      methodology: "Vanguard BETR algorithm (July 2025 research)"
      target_brackets:
        - "12% bracket (preferred)"
        - "22% bracket (acceptable)"
        - "24% bracket (maximum)"
      betr_optimization:
        description: "BETR calculates break-even future tax rate accounting for multiple factors"
        factors_considered:
          - "Current vs expected future tax rates"
          - "Tax payment source (taxable account vs IRA)"
          - "Nontaxable basis in Traditional IRA"
          - "Future backdoor Roth opportunities"
          - "Time horizon and investment returns"
        decision_rule: "Convert if expected future tax rate > BETR"
      calculation: |
        # Use BETR algorithm from betr_roth_conversion.py
        from betr_roth_conversion import optimize_conversion_amount, BETRInputs, calculate_betr
        
        # Optimize conversion to stay within target bracket
        optimal_amount, betr_results = optimize_conversion_amount(
            traditional_ira_balance=traditional_balance,
            current_agi=current_income,
            target_tax_bracket=max_conversion_rate,
            year=current_year,
            pay_from_taxable=True,
            taxable_account_balance=taxable_balance,
            years_to_withdrawal=years_until_rmd,
            annual_return=growth_rate - 1.0
        )
        
        # Verify conversion is beneficial
        if betr_results.conversion_recommended:
            roth_conversion = optimal_amount
        else:
            roth_conversion = 0  # Skip conversion if BETR analysis says no
      constraints:
        - "Limited by Traditional IRA balance"
        - "Consider ACA subsidy cliffs"
        - "Watch future IRMAA impact (2-year lookback)"
        - "BETR must indicate conversion is beneficial"
        
    ltcg_harvesting:
      strategy: "Harvest at 0% capital gains rate"
      bracket_limit: "~$94,000 MAGI for married filing jointly"
      calculation: "ltcg_room = cg_0_percent_limit - std_deduction"
      benefits:
        - "Tax-free income to fund expenses"
        - "Reset cost basis higher"
        - "No wash sale rule for gains"
      implementation: "Sell appreciated positions, immediately rebuy"
      
    aca_optimization:
      enabled: "When aca_optimize = True"
      target: "Keep MAGI < 400% Federal Poverty Level"
      benefit: "Maximize premium tax credits"
      calculation: "calculate_aca_subsidy(magi, year, household_size)"
      trade_off: "May limit Roth conversions to stay under threshold"
      
    withdrawal_sequence:
      order:
        1: "Cash (for immediate expenses)"
        2: "Taxable (LTCG harvesting)"
        3: "Roth (preserve for last)"
      rationale: "Minimize taxes while maintaining liquidity"
      
    buffer_replenishment:
      source: "Traditional IRA withdrawals"
      timing: "Before Roth conversions"
      amount: "Sufficient to reach/maintain buffer targets"
      
  implementation_details:
    key_calculations:
      ltcg_harvest: |
        cg_0_percent_limit = get from cap_gains_brackets
        ltcg_room = cg_0_percent_limit - std_deduction
        ltcg_harvested = min(expenses * 1.15, ltcg_room, taxable * 0.5)
        
      roth_conversion: |
        # Use BETR algorithm for optimal conversion
        from betr_roth_conversion import optimize_conversion_amount
        
        target_bracket_rate, target_bracket_upper = get_target_conversion_bracket(max_rate)
        current_income = ltcg_harvested
        
        # Calculate optimal conversion using BETR
        optimal_amount, betr_results = optimize_conversion_amount(
            traditional_ira_balance=traditional_balance,
            current_agi=current_income,
            target_tax_bracket=target_bracket_rate,
            year=current_year,
            pay_from_taxable=True,
            taxable_account_balance=taxable_balance,
            years_to_withdrawal=(73 - age_primary),  # Years until RMD
            annual_return=growth_rate - 1.0
        )
        
        # Only convert if BETR analysis recommends it
        if betr_results.conversion_recommended:
            roth_conversion = optimal_amount
            logger.info(f"BETR: {betr_results.betr:.2%}, Conversion: ${optimal_amount:,.0f}")
        else:
            roth_conversion = 0
            logger.info(f"BETR: {betr_results.betr:.2%}, Conversion not recommended")
        
      tax_calculation: |
        total_income = ltcg_harvested + roth_conversion
        agi = total_income - std_deduction
        federal_tax = calculate_taxable_income(agi, tax_brackets)
        cg_tax = calculate_cap_gains(agi - ltcg_harvested, cg_brackets, ltcg_harvested)
        total_tax = federal_tax + cg_tax
        
      withdrawal_logic: |
        total_outflow = expenses + total_tax
        cash_withdrawal = min(total_outflow, cash_balance)
        remaining = total_outflow - cash_withdrawal
        taxable_withdrawal = min(remaining, ltcg_harvested, taxable_balance)
        remaining -= taxable_withdrawal
        roth_withdrawal = min(remaining, roth_balance)
        
      buffer_building: |
        cash_need, taxable_need = calculate_buffer_ramp_up(year, start_year, targets, current)
        traditional_withdrawal = min(cash_need + taxable_need, traditional - roth_conversion)
        
    balance_updates:
      cash: "cash - cash_withdrawal"
      taxable: "taxable + traditional_withdrawal + ltcg_harvested - taxable_withdrawal"
      traditional: "traditional - traditional_withdrawal - roth_conversion"
      roth: "roth + roth_conversion - roth_withdrawal"
      growth: "Apply growth_rate to taxable, traditional, roth"

# ==============================================================================
# STAGE 3: MEDICARE
# ==============================================================================

stage_3_medicare:
  name: "Stage 3: Medicare"
  description: "On Medicare, optimizing for IRMAA while continuing conversions"
  
  trigger_conditions:
    - has_wages: false
    - has_ss: false
    - age_primary: ">= 65"
    - age_spouse: ">= 65"
    - age_primary: "< 73"
    
  objectives:
    primary: "Balance Roth conversions with IRMAA penalties"
    secondary:
      - "Avoid crossing IRMAA thresholds"
      - "Continue tax-efficient conversions"
      - "Maintain cash buffers"
      - "Plan for 2-year MAGI lookback"
      
  strategy:
    irmaa_management:
      lookback_period: "2 years"
      description: "IRMAA based on MAGI from 2 years prior"
      thresholds_2024:
        tier_1: "$103,000 - $129,000: +$69.90/month"
        tier_2: "$129,000 - $161,000: +$174.70/month"
        tier_3: "$161,000 - $193,000: +$279.50/month"
        tier_4: "$193,000+: Higher penalties"
      people_on_medicare: "1 or 2 (affects total penalty)"
      
    conversion_strategy:
      approach: "Use BETR algorithm with IRMAA penalty consideration"
      methodology: "BETR analysis adjusted for IRMAA impact"
      decision_logic: |
        # Use BETR with IRMAA adjustment
        from betr_roth_conversion import optimize_conversion_amount, calculate_betr
        
        # Calculate optimal conversion using BETR
        optimal_amount, betr_results = optimize_conversion_amount(
            traditional_ira_balance=traditional_balance,
            current_agi=current_income,
            target_tax_bracket=target_rate,
            year=current_year,
            pay_from_taxable=True,
            taxable_account_balance=taxable_balance,
            years_to_withdrawal=(73 - age_primary)
        )
        
        # Check IRMAA impact of proposed conversion
        proposed_magi = current_income + optimal_amount
        future_irmaa = calculate_irmma_penalty(proposed_magi, year + 2, people_on_medicare)
        
        # Adjust conversion if IRMAA penalty too high
        if future_irmaa > (optimal_amount * 0.02):  # If IRMAA > 2% of conversion
            # Reduce conversion to stay below IRMAA threshold
            irmaa_safe_amount = find_amount_below_irmaa_threshold()
            
            # Recalculate BETR with reduced amount
            reduced_inputs = BETRInputs(...)
            reduced_results = calculate_betr(reduced_inputs)
            
            if reduced_results.conversion_recommended:
                roth_conversion = irmaa_safe_amount
            else:
                roth_conversion = 0
        else:
            roth_conversion = optimal_amount if betr_results.conversion_recommended else 0
      target: "Maximize conversions while managing IRMAA using BETR"
      
    withdrawal_sequence:
      same_as: "Stage 2 (Cash → Taxable → Roth)"
      additions:
        - "Monitor MAGI for IRMAA impact"
        - "May use Roth earlier to avoid IRMAA"
        
  implementation_details:
    key_calculations:
      irmaa_check: |
        magi_2_years_ago = get from historical tracking
        people_on_medicare = count(age >= 65)
        irmaa_penalty = calculate_irmma_penalty(magi_2_years_ago, year, people_on_medicare)
        
      conversion_optimization: |
        # Use BETR algorithm with IRMAA consideration
        from betr_roth_conversion import optimize_conversion_amount
        
        # Calculate optimal conversion using BETR
        optimal_amount, betr_results = optimize_conversion_amount(
            traditional_ira_balance=traditional_balance,
            current_agi=current_income,
            target_tax_bracket=target_rate,
            year=current_year,
            pay_from_taxable=True,
            taxable_account_balance=taxable_balance,
            years_to_withdrawal=(73 - age_primary)
        )
        
        # Check IRMAA impact
        proposed_magi = current_income + optimal_amount
        future_irmaa = calculate_irmma_penalty(proposed_magi, year + 2, people_on_medicare)
        
        # BETR-based decision with IRMAA adjustment
        if betr_results.conversion_recommended and future_irmaa < (optimal_amount * 0.02):
            roth_conversion = optimal_amount
        else:
            # Find IRMAA-safe amount and verify with BETR
            irmaa_safe_amount = find_amount_below_irmaa_threshold()
            # Recalculate BETR for reduced amount
            # Only convert if still beneficial per BETR
            
    magi_tracking:
      purpose: "Track MAGI for 2-year IRMAA lookback"
      storage: "magi_history dictionary keyed by year"
      usage: "irmaa_penalty = calculate from magi_history[year - 2]"

# ==============================================================================
# STAGE 4: SOCIAL SECURITY
# ==============================================================================

stage_4_social_security:
  name: "Stage 4: Social Security"
  description: "Collecting SS benefits with Medicare, pre-RMD"
  
  trigger_conditions:
    - has_ss: true
    - age_primary: "< 73"
    
  objectives:
    primary: "Optimize taxation of SS benefits"
    secondary:
      - "Manage IRMAA with SS income"
      - "Limited Roth conversions"
      - "Supplement with portfolio withdrawals"
      
  strategy:
    ss_taxation:
      taxable_percentage: "Up to 85% of benefits"
      calculation: "Based on combined income (AGI + 50% SS + tax-exempt interest)"
      thresholds:
        tier_1: "$32,000 - $44,000: 50% taxable"
        tier_2: "> $44,000: 85% taxable"
        
    conversion_constraints:
      limitation: "SS income reduces conversion room"
      calculation: "conversion_room = bracket_upper - std_deduction - ss_benefits - other_income"
      trade_off: "SS + conversions can trigger higher IRMAA"
      
    withdrawal_strategy:
      primary_income: "Social Security benefits"
      supplemental: "Portfolio withdrawals as needed"
      sequence: "Cash → Taxable → Roth (same as earlier stages)"
      
  implementation_details:
    key_calculations:
      ss_benefits: |
        ss_benefits = get_monthly_benefit(person_name, year, claiming_age) * 12
        taxable_ss = ss_benefits * 0.85  # Assume 85% taxable at higher incomes
        
      conversion_with_ss: |
        # Use BETR algorithm with Social Security income
        from betr_roth_conversion import optimize_conversion_amount
        
        current_income = ss_benefits + ltcg_harvested
        
        # Calculate optimal conversion using BETR
        optimal_amount, betr_results = optimize_conversion_amount(
            traditional_ira_balance=traditional_balance,
            current_agi=current_income,
            target_tax_bracket=target_rate,
            year=current_year,
            pay_from_taxable=True,
            taxable_account_balance=taxable_balance,
            years_to_withdrawal=(73 - age_primary)
        )
        
        # BETR analysis accounts for SS income in current AGI
        # Only convert if BETR indicates benefit despite SS income
        if betr_results.conversion_recommended:
            roth_conversion = optimal_amount
        else:
            roth_conversion = 0
        # Likely much smaller than Stage 2/3 due to SS income
        
      irmaa_impact: |
        magi = ss_benefits + conversions + other_income
        # Track for 2-year lookback
        magi_history[year] = magi

# ==============================================================================
# STAGE 5: RMD
# ==============================================================================

stage_5_rmd:
  name: "Stage 5: RMD"
  description: "Required Minimum Distributions with full retirement income"
  
  trigger_conditions:
    - age_primary: ">= 73"
    
  objectives:
    primary: "RMD compliance"
    secondary:
      - "Minimize tax impact of forced distributions"
      - "Optimize withdrawal sequencing"
      - "Manage IRMAA with RMD income"
      
  strategy:
    rmd_calculation:
      formula: "Traditional IRA balance ÷ Life Expectancy Factor"
      table: "IRS Uniform Lifetime Table"
      deadline: "December 31 each year"
      penalty: "50% of shortfall if missed"
      age_start: "73 (SECURE Act 2.0)"
      
    tax_management:
      challenge: "RMDs may fill lower tax brackets"
      opportunity: "Limited Roth conversion room"
      approach: "Use RMD to fund expenses first"
      
    withdrawal_sequence:
      1: "RMD (required)"
      2: "Cash (for additional needs)"
      3: "Taxable (LTCG if needed)"
      4: "Roth (preserve for last)"
      
    irmaa_consideration:
      impact: "RMDs increase MAGI"
      strategy: "May need to use Roth to avoid IRMAA thresholds"
      planning: "Consider QCDs (Qualified Charitable Distributions)"
      
  implementation_details:
    key_calculations:
      rmd_amount: |
        rmd_amount = get_rmd_value(traditional_balance, age_primary, year)
        # Must withdraw this amount minimum
        
      tax_calculation: |
        total_income = ss_benefits + rmd_amount + other_income
        agi = total_income - std_deduction
        federal_tax = calculate_taxable_income(agi, tax_brackets)
        
      conversion_opportunity: |
        # Very limited due to RMD income
        current_income = ss_benefits + rmd_amount
        conversion_room = target_bracket_upper - std_deduction - current_income
        # Often zero or minimal
        
    balance_updates:
      traditional: "traditional - rmd_amount - additional_withdrawals"
      cash: "cash + rmd_amount - expenses"
      # RMD goes to cash first, then used for expenses

# ==============================================================================
# TAX PLANNING: STATE TAXES
# ==============================================================================

state_tax_planning:
  overview:
    description: |
      State income tax planning is critical for retirement optimization as state tax rates
      can significantly impact net withdrawal amounts. Some states have no income tax,
      while others tax retirement income at rates up to 13.3%. Strategic planning includes
      residency optimization, timing of income recognition, and state-specific deductions.
      
  key_considerations:
    residency:
      importance: "State residency determines which state's tax laws apply"
      factors:
        - "Physical presence (typically 183+ days)"
        - "Domicile intent (voter registration, driver's license)"
        - "Property ownership and location"
        - "Family and business ties"
      strategy: "Consider relocating to low/no tax states before retirement"
      
    state_categories:
      no_income_tax_states:
        states: ["Alaska", "Florida", "Nevada", "South Dakota", "Tennessee", "Texas", "Washington", "Wyoming"]
        benefit: "No state income tax on any income source"
        considerations: "May have higher property or sales taxes"
        
      retirement_friendly_states:
        description: "States that don't tax Social Security or have favorable retirement income treatment"
        examples:
          - "Pennsylvania: No tax on retirement income (SS, pensions, IRA/401k)"
          - "Mississippi: No tax on retirement income"
          - "Illinois: No tax on retirement income"
        strategy: "Maximize retirement account withdrawals in these states"
        
      high_tax_states:
        examples:
          - "California: Up to 13.3% (but doesn't tax SS)"
          - "New York: Up to 10.9%"
          - "New Jersey: Up to 10.75%"
          - "Oregon: Up to 9.9%"
        strategy: "Aggressive Roth conversions before moving or while in lower brackets"
        
  state_specific_strategies:
    roth_conversion_timing:
      high_tax_state_resident:
        strategy: "Delay conversions until moving to low-tax state"
        exception: "Convert if federal bracket opportunity outweighs state tax"
        calculation: "net_benefit = federal_tax_savings - state_tax_cost"
        
      planning_to_relocate:
        strategy: "Accelerate conversions after establishing residency in low-tax state"
        timing: "Wait until domicile clearly established (6-12 months)"
        documentation: "Maintain records proving new state residency"
        
    withdrawal_sequencing:
      high_tax_state:
        priority:
          1: "Roth withdrawals (tax-free at state level)"
          2: "Long-term capital gains (often lower state rate)"
          3: "Traditional IRA (fully taxed by state)"
        rationale: "Minimize state taxable income"
        
      no_tax_state:
        priority: "Follow federal optimization only"
        benefit: "More flexibility in withdrawal sequencing"
        
    social_security_optimization:
      states_that_tax_ss:
        list: ["Colorado", "Connecticut", "Kansas", "Minnesota", "Missouri", "Montana", 
               "Nebraska", "New Mexico", "Rhode Island", "Utah", "Vermont", "West Virginia"]
        strategy: "Consider delaying SS if in high-tax state and planning to move"
        
      states_with_ss_exemptions:
        description: "Many states have income thresholds for SS taxation"
        strategy: "Manage other income to stay below exemption thresholds"
        
  implementation_approach:
    data_requirements:
      - state_of_residence: "Current and projected future state"
      - state_tax_rates: "Marginal rates by income bracket"
      - state_standard_deduction: "State-specific deductions"
      - retirement_income_exemptions: "State-specific retirement income treatment"
      - ss_taxation_rules: "Whether state taxes Social Security"
      
    calculation_method:
      state_taxable_income: |
        # Start with federal AGI
        state_agi = federal_agi
        
        # Apply state-specific adjustments
        state_agi += state_additions  # (e.g., municipal bond interest from other states)
        state_agi -= state_subtractions  # (e.g., retirement income exemptions)
        
        # Apply state standard deduction
