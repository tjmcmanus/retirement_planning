helper_functions:
  calculate_cash_buffer_targets:
    purpose: "Calculate target buffer amounts"
    parameters:
      - expenses: "Annual expenses"
    returns:
      - cash_target: "2 years of expenses"
      - taxable_target: "3 years of expenses"
    formula: |
      cash_target = expenses * 2.0
      taxable_target = expenses * 3.0
      
  calculate_buffer_ramp_up:
    purpose: "Calculate buffer additions during 3-year ramp-up"
    parameters:
      - current_year: "Current projection year"
      - start_year: "Year strategy started"
      - cash_target: "Target cash buffer"
      - taxable_target: "Target taxable buffer"
      - current_cash: "Current cash balance"
      - current_taxable: "Current taxable balance"
    returns:
      - cash_needed: "Amount to add to cash this year"
      - taxable_needed: "Amount to add to taxable this year"
    logic: |
      years_elapsed = current_year - start_year
      if years_elapsed >= 3:
          # Maintain targets
          cash_needed = max(0, cash_target - current_cash)
          taxable_needed = max(0, taxable_target - current_taxable)
      else:
          # Ramp up proportionally
          progress_ratio = (years_elapsed + 1) / 3
          cash_needed = max(0, cash_target * progress_ratio - current_cash)
          taxable_needed = max(0, taxable_target * progress_ratio - current_taxable)
          
  get_target_conversion_bracket:
    purpose: "Find optimal tax bracket for Roth conversions"
    parameters:
      - max_rate: "Maximum tax rate from user config (e.g., 0.24)"
      - tax_brackets: "DataFrame with tax bracket data"
    returns:
      - target_rate: "Selected tax rate for conversions"
      - upper_limit: "Upper income limit of that bracket"
    logic: |
      # Get all rates up to max_rate
      available_rates = tax_brackets[rate <= max_rate]['rate'].unique()
      available_rates = sorted(available_rates, reverse=True)
      # Remove 0% bracket
      available_rates = [r for r in available_rates if r > 0]
      # Try each rate from highest to lowest
      for rate in available_rates:
          try:
              upper_limit = getUpperIncomeRate(rate, tax_brackets)
              return rate, upper_limit
          except ValueError:
              continue
              
  calculate_aca_subsidy:
    purpose: "Calculate ACA marketplace subsidies"
    parameters:
      - magi: "Modified Adjusted Gross Income"
      - year: "Tax year"
      - household_size: "Number in household"
    returns:
      - subsidy_amount: "Annual subsidy"
      - net_premium: "Net premium after subsidy"
    logic: |
      fpl = get_federal_poverty_level(year, household_size)
      fpl_percentage = (magi / fpl) * 100
      
      if fpl_percentage <= 150:
          # Free coverage
          return benchmark_premium, 0
      elif fpl_percentage <= 400:
          # Sliding scale subsidy
          max_contribution = calculate_max_contribution(fpl_percentage)
          subsidy = benchmark_premium - max_contribution
          return subsidy, max_contribution
      else:
          # No subsidy
          return 0, benchmark_premium
            
  optimize_rmd_lookback:
    purpose: "Review projected RMDs and optimize earlier conversions/withdrawals"
    description: |
      After initial strategy calculation, analyze Stage 5 RMDs to determine if they
      exceed expenses. If so, increase Roth conversions or Traditional withdrawals
      in earlier stages (2-4) to reduce future RMD burden and improve tax efficiency.
    parameters:
      - strategies: "List of YearlyStrategy objects from initial calculation"
      - traditional_balance_by_year: "Dictionary of Traditional IRA balances by year"
      - expenses_by_year: "Dictionary of annual expenses by year"
      - rmd_start_year: "Year when RMDs begin (typically age 73)"
    returns:
      - adjusted_strategies: "Optimized strategy list with increased early conversions"
      - optimization_report: "Summary of adjustments made"
    logic: |
      # Step 1: Analyze Stage 5 RMDs
      rmd_years = [s for s in strategies if s.stage == "Stage 5: RMD"]
      
      if not rmd_years:
          return strategies, "No RMD years to optimize"
      
      # Step 2: Calculate average RMD excess over expenses
      total_rmd_excess = 0
      rmd_count = 0
      
      for year_strategy in rmd_years:
          rmd_excess = year_strategy.rmd_amount - year_strategy.expenses
          if rmd_excess > 0:
              total_rmd_excess += rmd_excess
              rmd_count += 1
      
      if rmd_count == 0 or total_rmd_excess <= 0:
          return strategies, "RMDs do not exceed expenses - no optimization needed"
      
      avg_rmd_excess = total_rmd_excess / rmd_count
      
      # Step 3: Calculate additional conversions needed in earlier years
      # Distribute excess RMD reduction across pre-RMD years
      pre_rmd_years = [s for s in strategies if s.stage in [
          "Stage 2: Early Retirement",
          "Stage 3: Medicare", 
          "Stage 4: Social Security"
      ]]
      
      if not pre_rmd_years:
          return strategies, "No pre-RMD years available for optimization"
      
      # Target: Reduce Traditional IRA to minimize future RMDs
      # Additional annual conversion = avg_rmd_excess / years_available
      years_available = len(pre_rmd_years)
      additional_conversion_per_year = avg_rmd_excess / years_available
      
      # Step 4: Adjust strategies for each pre-RMD year
      adjusted_strategies = []
      total_additional_conversions = 0
      
      for year_strategy in strategies:
          if year_strategy.stage in ["Stage 2: Early Retirement", 
                                      "Stage 3: Medicare",
                                      "Stage 4: Social Security"]:
              # Increase Roth conversion
              original_conversion = year_strategy.roth_conversion
              
              # Check if additional conversion fits within tax bracket and BETR
              max_additional = min(
                  additional_conversion_per_year,
                  year_strategy.balances.traditional * 0.15  # Max 15% of balance per year
              )
              
              # Recalculate with BETR to verify benefit
              from betr_roth_conversion import calculate_betr, BETRInputs
              
              betr_inputs = BETRInputs(
                  current_marginal_rate=year_strategy.federal_tax / year_strategy.agi if year_strategy.agi > 0 else 0.24,
                  expected_future_rate=0.24,  # Assume 24% in RMD years
                  conversion_amount=original_conversion + max_additional,
                  traditional_ira_balance=year_strategy.balances.traditional,
                  pay_from_taxable=True,
                  taxable_account_balance=year_strategy.balances.taxable,
                  years_to_withdrawal=(73 - year_strategy.age_primary)
              )
              
              betr_results = calculate_betr(betr_inputs)
              
              if betr_results.conversion_recommended:
                  year_strategy.roth_conversion += max_additional
                  total_additional_conversions += max_additional
                  logger.info(f"Year {year_strategy.year}: Increased conversion by ${max_additional:,.0f} to reduce future RMDs")
          
          adjusted_strategies.append(year_strategy)
      
      # Step 5: Generate optimization report
      optimization_report = {
          "avg_rmd_excess": avg_rmd_excess,
          "years_optimized": years_available,
          "additional_conversions_per_year": additional_conversion_per_year,
          "total_additional_conversions": total_additional_conversions,
          "estimated_rmd_reduction": total_additional_conversions * 0.04  # Approximate RMD reduction
      }
      
      return adjusted_strategies, optimization_report
    
    usage: |
      # After initial strategy calculation
      initial_strategies = calculate_multi_year_strategy(...)
      
      # Optimize based on RMD lookback
      optimized_strategies, report = optimize_rmd_lookback(
          strategies=initial_strategies,
          traditional_balance_by_year={s.year: s.balances.traditional for s in initial_strategies},
          expenses_by_year={s.year: s.expenses for s in initial_strategies},
          rmd_start_year=2049  # Year when primary reaches age 73
      )
      
      # Log optimization results
      logger.info(f"RMD Optimization Report:")
      logger.info(f"  Average RMD excess: ${report['avg_rmd_excess']:,.0f}")
      logger.info(f"  Additional conversions: ${report['total_additional_conversions']:,.0f}")
      logger.info(f"  Estimated RMD reduction: ${report['estimated_rmd_reduction']:,.0f}")
      
      return optimized_strategies


# ==============================================================================
# MAIN ENGINE
# ==============================================================================

withdrawal_strategy_engine:
  class: "WithdrawalStrategyEngine"
  
  initialization:
    stages:
      - Stage1Accumulation()
      - Stage2EarlyRetirement()
      - Stage3Medicare()
      - Stage4SocialSecurity()
      - Stage5RMD()
    magi_history: "Dictionary to track MAGI for IRMAA lookback"
    
  determine_stage:
    purpose: "Select applicable life stage for current year"
    logic: |
      for stage in self.stages:
          if stage.applies(age_primary, age_spouse, year, has_wages, has_ss):
              return stage
      # Default to Stage 2 if no match
      return Stage2EarlyRetirement()
      
  calculate_multi_year_strategy:
    purpose: "Project strategy across multiple years"
    parameters:
      - start_year: "Starting year"
      - end_year: "Ending year"
      - initial_balances: "PortfolioBalances"
      - initial_expenses: "Annual expenses"
      - person1_name: "Primary person name"
      - person2_name: "Spouse name"
      - growth_rate: "Annual portfolio growth (default 1.07)"
      - expense_inflation_rate: "Annual expense inflation (default 0.993)"
      - ss_claiming_age: "SS claiming age (default 67)"
      - retirement_year: "Year of retirement"
      - has_wages: "Whether still earning wages"
    
    process:
      1: "Initialize tracking variables"
      2: "Loop through each year from start to end"
      3: "Calculate ages for both people"
      4: "Determine if collecting SS benefits"
      5: "Select applicable life stage"
      6: "Calculate yearly strategy using stage logic"
      7: "Track MAGI for IRMAA lookback"
      8: "Update balances for next year"
      9: "Inflate expenses for next year"
      10: "Collect all yearly strategies"
      11: "Perform RMD lookback optimization"
      12: "Adjust earlier year conversions if RMDs exceed expenses"
      13: "Convert to DataFrame"
      
    rmd_lookback_optimization:
      description: "After initial calculation, review Stage 5 RMDs and optimize earlier stages"
      trigger: "If any RMD year has RMD > expenses"
      action: "Increase Roth conversions in Stages 2-4 to reduce future Traditional IRA balance"
      verification: "Use BETR algorithm to verify additional conversions are beneficial"
      
    returns:
      - strategies: "List of YearlyStrategy objects (optimized for RMDs)"
      
  _strategies_to_dataframe:
    purpose: "Convert strategy list to pandas DataFrame"
    columns:
      - Year
      - Age (formatted as "primary/spouse")
      - Stage
      - Wages
      - SS Benefits
      - RMD
      - Traditional Withdrawal
      - Taxable Withdrawal
      - Roth Withdrawal
      - Roth Conversion
      - LTCG Harvested
      - DAF Contribution
      - Expenses
      - Federal Tax
      - IRMAA Penalty
      - ACA Premium
      - Cash Balance
      - Taxable Balance
      - Traditional Balance
      - Roth Balance
      - DAF Balance
      - Total Portfolio

