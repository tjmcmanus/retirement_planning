[pytest]
# Pytest configuration for retirement planning project

markers =
    integration: marks tests as integration tests requiring internet connection (deselect with '-m "not integration"')
    slow: marks tests as slow running
    ui: marks tests that test UI components

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=50

# Test directories
testpaths = tests
norecursedirs = .git .venv __pycache__ *.egg-info .pytest_cache scripts migrations .backups

[coverage:run]
omit =
    tests/*
    scripts/*
    .venv/*
    */__pycache__/*
    planning_app.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
    \.\.\.

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

; Made with Bob
